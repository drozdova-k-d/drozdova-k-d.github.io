let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { } }
function beep() {
  if (!S.settings.sound || !actx) return;
  try { const t = actx.currentTime; [0, .24, .48].forEach((d, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = i === 2 ? 1046 : 784; g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.3, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .2); o.connect(g); g.connect(actx.destination); o.start(t + d); o.stop(t + d + .22); }); } catch (e) { }
}
const restFor = e => e.rest || (e.type === 'wr' ? S.settings.rest : Math.min(S.settings.rest, 60));
function startRest(sec) { unlockAudio(); rest = { end: Date.now() + sec * 1000, total: sec, over: false, overAt: 0 }; drawRest(true); }
function drawRest(fresh) {

  el.classList.remove('hidden');
  if (fresh || !el.firstChild) el.innerHTML = `<div class="rest-i"><div class="rest-t"><small>отдых</small><b id="restT">0:00</b></div><div class="rest-p"><i id="restP"></i></div><button data-act="restm">−15</button><button data-act="restp">+15</button><button data-act="rests" aria-label="пропустить">${I.x}</button></div>`;
  tickRest();
}
function tickRest() {
  if (!rest) return;
  const left = Math.ceil((rest.end - Date.now()) / 1000);
  const t = $('#restT'), p = $('#restP'), el = $('#rest'); if (!t) return;
  if (left <= 0) { if (!rest.over) { rest.over = true; rest.overAt = Date.now(); beep(); } t.textContent = 'Пора!'; p.style.width = '100%'; el.classList.add('over'); if (Date.now() - rest.overAt > 12000) { rest = null; el.classList.remove('over'); drawRest(); } return; }
  el.classList.remove('over'); t.textContent = Math.floor(left / 60) + ':' + pad(left % 60); p.style.width = Math.min(100, (1 - left / rest.total) * 100) + '%';
}

/* ---------- Экспорт / импорт ---------- */
function fileName(ext) { return `dnevnik-trenirovok-${today()}.${ext}`; }
function toCsv() {
  const q = v => { v = String(v == null ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const rows = [['Дата', 'Неделя', 'Тренировка', 'Начало', 'Блок', 'Упражнение', 'Тип подхода', 'Номер', 'Вес', 'Ед. веса', 'Вес, кг', 'Повторы или секунды', 'Объём, кг', 'Заметка']];
  doneSessions().forEach(s => {
    s.layout.blocks.forEach(b => b.exercises.forEach(e => { let n = 0; const en = s.entries[e.id]; if (!en) return;
      if (en.state === 'skip') { rows.push([s.date, s.week, s.layout.name, fmtClock(s.startedAt), b.name, e.name, 'пропущено', '', '', '', '', '', '', en.note]); return; }
      let any = false;
      en.sets.forEach(x => { if (!validSet(x)) return; any = true; if (!x.warm) n++;
        const w = num(x.w) || 0, r = num(x.r), kg = toKg(w, wuOf(e));
        rows.push([s.date, s.week, s.layout.name, fmtClock(s.startedAt), b.name, e.name, x.warm ? 'разминка' : 'рабочий', x.warm ? '' : n, e.type === 'wr' ? fmt(w) : '', e.type === 'wr' ? wl(e) : '', e.type === 'wr' ? fmt(Math.round(kg * 10) / 10) : '', fmt(r), e.type === 'wr' && !e.assist && !x.warm ? fmt(Math.round(kg * r * 10) / 10) : '', n === 1 ? en.note : '']); });
      if (!any && en.state === 'done') rows.push([s.date, s.week, s.layout.name, fmtClock(s.startedAt), b.name, e.name, 'выполнено без записи', '', '', '', '', '', '', en.note]); }));
    if (s.cardio && num(s.cardio.minutes) > 0) rows.push([s.date, s.week, s.layout.name, fmtClock(s.startedAt), 'Кардио', s.cardio.machine || 'Кардио', 'кардио', '', '', '', '', fmt(num(s.cardio.minutes)), '', ['уровень ' + s.cardio.level, s.cardio.km && s.cardio.km + ' км', s.cardio.kcal && s.cardio.kcal + ' ккал'].filter(x => x && x !== 'уровень ').join(', ')]);
  });
  return '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n');
}
function download(name, text, mime) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }

    case 'exportShare': exportShare(); break;
    case 'exportJson': backupText().then(t => { download(fileName('json'), t, 'application/json'); markBackup(); toast('Файл скачан'); render(); }); break;
    case 'exportCsv': download(fileName('csv'), toCsv(), 'text/csv'); toast('CSV скачан'); break;
    case 'copyJson': backupText().then(t => navigator.clipboard.writeText(t)).then(() => { markBackup(); toast('Скопировано. Фото в текст не входят, для них используй файл'); render(); }).catch(() => toast('Не удалось скопировать')); break;

    case 'pasteGo': { const v = $('#f-paste').value; closeSheet(); importAsk(v); break; }

    case 'bDel2': { const w = S.plan.workouts.find(x => x.id === ui.pw); w.blocks = w.blocks.filter(b => b.id !== d.b); flush(); closeSheet(); render(); break; }
    case 'bNew': { const w = S.plan.workouts.find(x => x.id === ui.pw); w.blocks.push({ id: uid(), name: 'Новый блок', exercises: [] }); flush(); render(); break; }
    case 'eUp': case 'eDown': { const b = S.plan.workouts.find(x => x.id === ui.pw).blocks.find(x => x.id === d.b), i = b.exercises.findIndex(e => e.id === d.ex), j = i + (a === 'eUp' ? -1 : 1); if (j >= 0 && j < b.exercises.length) { [b.exercises[i], b.exercises[j]] = [b.exercises[j], b.exercises[i]]; flush(); render(); } break; }
    case 'exEdit': { const b = S.plan.workouts.find(x => x.id === ui.pw).blocks.find(x => x.id === d.b), e = b.exercises.find(x => x.id === d.ex); ui.ed = { mode: 'plan', b: d.b, ex: clone(e), isNew: false }; openSheet(exForm(ui.ed.ex, 'plan')); break; }
    case 'exNew': ui.ed = { mode: 'plan', b: d.b, ex: Object.assign(X(uid(), '', ''), { _new: true }), isNew: true }; openSheet(exForm(ui.ed.ex, 'plan')); break;
    case 'seg': {
      const k = d.k, v = d.v, e = ui.ed.ex; readExForm();
      e[k] = (k === 'assist' || k === 'warm') ? v === '1' : v;

      readExForm(); const e = ui.ed.ex; if (!e.name.trim()) { toast('Введи название'); break; } delete e._new;
      if (ui.ed.mode === 'session') {
        const b = s.layout.blocks.find(x => x.id === ui.ed.b);
        if (ui.ed.isNew) { b.exercises.push(e); s.entries[e.id] = { sets: makeSets(e), note: '', state: '' }; }
        else { b.exercises[b.exercises.findIndex(x => x.id === e.id)] = e; adjustEntry(s, e); }
      } else {
        const b = S.plan.workouts.find(x => x.id === ui.pw).blocks.find(x => x.id === ui.ed.b);
        if (ui.ed.isNew) b.exercises.push(e); else b.exercises[b.exercises.findIndex(x => x.id === e.id)] = e;

    }
    case 'exDel': {
      if (ui.ed.mode === 'session') { const b = s.layout.blocks.find(x => x.id === ui.ed.b); b.exercises = b.exercises.filter(x => x.id !== ui.ed.ex.id); delete s.entries[ui.ed.ex.id]; }
      else { const b = S.plan.workouts.find(x => x.id === ui.pw).blocks.find(x => x.id === ui.ed.b); b.exercises = b.exercises.filter(x => x.id !== ui.ed.ex.id); }
      flush(); closeSheet(); render(); break;
    }
    /* правка состава конкретной тренировки */
    case 'sUp': case 'sDown': { const b = curBlock(), i = b.exercises.findIndex(e => e.id === d.ex), j = i + (a === 'sUp' ? -1 : 1); if (j >= 0 && j < b.exercises.length) { [b.exercises[i], b.exercises[j]] = [b.exercises[j], b.exercises[i]]; flush(); render(); } break; }

    case 'sDel2': { const b = curBlock(); b.exercises = b.exercises.filter(x => x.id !== d.ex); delete s.entries[d.ex]; flush(); closeSheet(); render(); break; }

document.addEventListener('input', ev => {
  const el = ev.target.closest('[data-f]'); if (!el) return; const f = el.dataset.f, v = el.value, s = ui.sid ? sess(ui.sid) : null;
  if (ui.view === 'workout' && s) {
    if (f === 'w' || f === 'r') { const g = getSet(el); g.set[f] = v.replace(',', '.'); if (f === 'r' && !(num(g.set.r) > 0)) g.set.done = false; saveSoon(); const b = $('#barSets'); if (b) { const st = sessionStats(s); b.textContent = st.exDone + ' / ' + st.exLeft; } }
    else if (f === 'enote') { s.entries[el.dataset.ex].note = v; saveSoon(); }
    else if (f === 'snote') { s.note = v; saveSoon(); }
    else if (f.startsWith('c.')) { s.cardio[f.slice(2)] = v; saveSoon(); }
  } else if (ui.view === 'summary' && s && f === 'snote') { s.note = v; saveSoon(); }
  else if (ui.view === 'techcard' && f.startsWith('tc.')) {
    const k = f.slice(3), lib = libOf(ui.tc);
    if (k === 'name' && lib) lib.name = v; else if (k === 'dose' && lib) lib.dose = v; else { S.tech[ui.tc] = S.tech[ui.tc] || {}; S.tech[ui.tc][k] = v; }
    saveSoon();
  }
  else if (ui.view === 'planw') { const w = S.plan.workouts.find(x => x.id === ui.pw); if (f === 'pn.name') w.name = v; else if (f === 'pn.focus') w.focus = v; else if (f === 'pb.name') w.blocks.find(b => b.id === el.dataset.b).name = v; saveSoon(); }
});
document.addEventListener('change', async ev => {
  const el = ev.target.closest('[data-f]');
  if (el && el.dataset.f === 'pe') { ui.pe = el.value; ui.pm = null; render(); }
  if (el && el.dataset.f === 'start') { if (el.value) { S.settings.start = el.value; flush(); render(); } }
  if (ev.target.id === 'imp' && ev.target.files[0]) { const r = new FileReader(); r.onload = () => importAsk(String(r.result)); r.readAsText(ev.target.files[0]); ev.target.value = ''; }
  if (ev.target.id === 'photoIn' && ev.target.files.length && ui.photoFor) {
    const id = ui.photoFor, files = [...ev.target.files]; ev.target.value = ''; let n = 0;
    for (const f of files) { try { const blob = await resizeImage(f, 1100), pid = 'u:' + uid(); await imgPut(pid, blob); const t = (S.tech[id] = S.tech[id] || {}); t.photos = (t.photos || []).concat(pid); n++; } catch (e) { toast('Не удалось обработать фото'); } }
    flush(); if (n) { toast(n > 1 ? 'Фото добавлены' : 'Фото добавлено'); if (ui.view === 'techcard') render(); }
  }
});
document.addEventListener('focusin', ev => { if (ev.target.matches && ev.target.matches('.stp input')) setTimeout(() => { try { ev.target.select(); } catch (e) { } }, 0); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { closeSheet(); $('#viewer').classList.add('hidden'); } if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.stp input')) ev.target.blur(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); else { wake(); tickRest(); } });
window.addEventListener('pagehide', flush);

/* ---------- старт ---------- */
(function init() {
  $('#tabs').innerHTML = [['home', I.home, 'Главная'], ['history', I.list, 'История'], ['tech', I.book, 'Техника'], ['progress', I.chart, 'Прогресс'], ['more', I.more, 'Ещё']].map(([v, i, l]) => `<button data-act="tab" data-v="${v}">${i}<span>${l}</span></button>`).join('');
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  const a = activeSession();
  if (a && Date.now() - a.startedAt < 14 * 36e5) { ui.sid = a.id; ui.view = 'workout'; ui.from = 'home'; }
  render(false);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
})();

</script>
