:root{
  --bg:#FFF5F9;--card:#fff;--ink:#3A1B2A;--muted:#9C7B8A;--line:#F7D6E3;
  --p:#E8457C;--p-d:#C21862;--p-l:#FFD3E3;--p-xl:#FFEEF5;--gold:#D98A3D;--gold-l:#FFF0DC;
  --r:22px;--shadow:0 8px 24px rgba(232,69,124,.10);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) linear-gradient(180deg,#FFDDEA 0,#FFF5F9 340px) no-repeat;color:var(--ink);font-family:'Nunito Variable','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.35;touch-action:manipulation;min-height:100vh}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.display{font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.ic{width:22px;height:22px;display:block;flex:none}
#app{max-width:520px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(104px + var(--sb))}
body.inwork #app{padding-top:0;padding-bottom:calc(150px + var(--sb))}
body.nobar:not(.inwork) #app{padding-bottom:calc(40px + var(--sb))}

/* ---- шапка ---- */
.hero{padding:10px 4px 18px}
.hero h1{font-size:34px;line-height:1.08;margin:6px 0 10px;color:var(--ink)}
.hero-s{font-size:14px;font-weight:700;color:var(--p-d)}.hero-s::first-letter{text-transform:uppercase}
.hero-w{display:inline-block;background:var(--p);color:#fff;border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px}
.hero.sm{text-align:center;padding-top:20px}.hero.sm h1{font-size:28px}
.trophy{width:68px;height:68px;border-radius:50%;margin:0 auto 6px;background:linear-gradient(135deg,#FF9DBB,#E8457C);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(232,69,124,.35)}
.trophy .ic{width:34px;height:34px}
.page-h{padding:8px 4px 12px}.page-h h1{margin:0;font-size:32px}
.sec-h{font-weight:800;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.07em;margin:20px 4px 10px}

/* ---- карточки ---- */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:0 0 14px;border:1px solid #FCE3ED}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h b{font-size:17px}.card-h b.display{font-size:20px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--p-xl);color:var(--p-d);font-weight:800;font-size:12.5px;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.gold{background:var(--gold-l);color:var(--gold)}
.cap{font-size:13.5px;color:var(--muted);margin:10px 2px 6px}.cap.center{text-align:center;margin-top:18px}
.warn{background:#FFF0DC;color:#8A5516;border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700;margin-bottom:12px}
.warn.soft{background:var(--p-xl);color:var(--p-d)}
.lnk{background:none;border:0;color:var(--p-d);font-weight:800;padding:6px 2px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---- кнопки ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:15px 20px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#FF7FA8,#E8457C 55%,#D12A6C);box-shadow:0 10px 20px rgba(232,69,124,.30)}
.btn:active{transform:scale(.98)}

.btn.ghost{background:var(--p-xl);color:var(--p-d);box-shadow:none}
.btn.light{background:#fff;color:var(--p-d);box-shadow:0 8px 18px rgba(120,0,50,.18)}
.btn.danger{background:#C0264F;box-shadow:none}

/* ---- главная ---- */

.wd i .ic{width:18px;height:18px}
.wd.has i{background:linear-gradient(135deg,#FF8FB1,#E8457C)}
.wd.td i{box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--p)}
.wd.td span{color:var(--p-d)}
.next{background:linear-gradient(135deg,#FF8FB1 0,#E8457C 55%,#C21862 100%);color:#fff;border-radius:26px;padding:20px;margin:0 0 14px;box-shadow:0 14px 30px rgba(232,69,124,.35);position:relative;overflow:hidden}
.next:before{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
.next-l{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.next-t{font-size:30px;margin:4px 0 2px}.next-f{font-weight:700;opacity:.95;margin-bottom:16px}
.wcard,.mrow-b,.hrow,.resume{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid #FCE3ED;border-radius:20px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);color:var(--ink)}
.wcard>.ic,.mrow-b>.ic,.hrow>.ic,.resume>.ic{color:#E7A9C0;width:20px;height:20px}

.wc-b,.mrow-b>span:nth-child(2),.hb{flex:1;min-width:0;display:flex;flex-direction:column}
.wc-b b,.mrow-b b,.hb b{font-size:16px}
.wc-b small,.mrow-b small,.hb small{color:var(--muted);font-weight:600;font-size:13px}
.wc-b em{font-style:normal;color:var(--p-d);font-weight:700;font-size:12.5px;margin-top:2px}
.resume{background:linear-gradient(135deg,#FFE3EE,#FFD0E1);border-color:#FFC1D7}
.resume small{display:block;color:var(--p-d);font-weight:700}
.rs-i{width:42px;height:42px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;flex:none}.rs-i .ic{width:18px;height:18px;margin-left:2px}
.resume>span:nth-child(2){flex:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{background:#fff;border-radius:20px;padding:14px 8px;text-align:center;box-shadow:var(--shadow);border:1px solid #FCE3ED}

.tile.pos b{color:#C21862}
.backup b,.install b{font-size:16px}.backup p,.install p{margin:6px 0 12px;font-size:14px;color:var(--muted)}
.backup{background:linear-gradient(135deg,#FFF7EC,#FFEFD9);border-color:#FFE0B8}.backup .btn{background:#D98A3D;box-shadow:none}

/* ---- экран тренировки ---- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 0 10px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;background:rgba(255,245,249,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tb-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:0;text-align:left}
.tb-t b{font-family:'Playfair Display',Georgia,serif;font-size:20px;line-height:1.15}
.tb-t small{color:var(--muted);font-weight:700;font-size:12.5px;display:flex;gap:5px;align-items:center}.tb-t small .ic{width:12px;height:12px}
.tb-t.plain{font-size:inherit}
.elapsed{font-weight:800;color:var(--p-d);font-variant-numeric:tabular-nums;background:#fff;border-radius:12px;padding:6px 10px;font-size:14px;box-shadow:0 4px 12px rgba(232,69,124,.12);min-width:52px;text-align:center}
.energy{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}.energy>span{font-weight:800;font-size:14px;color:var(--muted)}
.hearts{display:flex;gap:2px}.hr{border:0;background:none;color:#F2BCD0;padding:3px}.hr .ic{width:26px;height:26px}.hr.on{color:var(--p)}
.chk{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:9px 2px;font-weight:700;font-size:15.5px}
.chk i{width:30px;height:30px;border-radius:10px;border:2px solid var(--p-l);display:grid;place-items:center;color:transparent;flex:none;background:#fff}
.chk i .ic{width:18px;height:18px}.chk.on i{background:var(--p);border-color:var(--p);color:#fff}.chk.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:#E7A9C0}
.block-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}.block-h .display{font-size:24px;color:var(--p-d)}
.ex{background:#fff;border-radius:24px;padding:14px 14px 10px;margin-bottom:12px;box-shadow:var(--shadow);border:1.5px solid #FCE3ED}
.ex.complete{border-color:#FFB3CD;background:linear-gradient(180deg,#fff,#FFF8FB)}
.ex-h{display:flex;align-items:flex-start;gap:11px}
.ex-num{width:34px;height:34px;border-radius:12px;background:var(--p-xl);color:var(--p-d);font-weight:800;display:grid;place-items:center;flex:none;font-size:15px}
.ex.complete .ex-num{background:var(--p);color:#fff}.ex-num .ic{width:19px;height:19px}
.ex-t{flex:1;min-width:0;display:flex;flex-direction:column}
.ex-t b{font-size:17px;line-height:1.2}.ex-t small{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:1px}.ex-t em{font-style:normal;color:var(--p-d);font-weight:800;font-size:13px;margin-top:3px}
.last{font-size:13px;color:var(--muted);margin:10px 2px 4px;font-weight:600}.last b{color:var(--ink)}
.goal{display:flex;gap:6px;align-items:flex-start;font-size:13px;font-weight:700;color:var(--p-d);background:var(--p-xl);border-radius:12px;padding:7px 10px;margin:4px 0 6px}
.goal.up{background:linear-gradient(135deg,#FFE2EC,#FFD3E3)}.goal .ic{width:16px;height:16px;margin-top:1px}.goal.first{color:var(--muted);background:#FFF8FB;font-weight:600}
.set-head,.set{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center}
.set-head.nw,.set.nw{grid-template-columns:30px 1fr 46px}
.set-head{font-size:11px;font-weight:800;color:#C9A0B2;text-transform:uppercase;letter-spacing:.05em;text-align:center;margin-top:6px}
.set{padding:4px 0}
.set-n{width:28px;height:28px;border-radius:50%;background:var(--p-xl);color:var(--p-d);font-weight:800;font-size:13px;display:grid;place-items:center}
.set.warm .set-n{background:var(--gold-l);color:var(--gold)}
.stp{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;background:var(--p-xl);border-radius:14px;overflow:hidden;min-width:0}
.set.warm .stp{background:#FFF8EE}
.stp button{border:0;background:transparent;color:var(--p-d);font-size:21px;font-weight:800;height:46px;padding:0;line-height:1}
.stp input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font:inherit;font-weight:800;font-size:19px;color:var(--ink);height:46px;padding:0;outline:none;border-radius:0}
.stp input::placeholder{color:#E3A3BC;font-weight:700}
.stp:focus-within{box-shadow:inset 0 0 0 2px var(--p)}
.set-ok{width:46px;height:46px;border-radius:15px;border:2px solid var(--p-l);background:#fff;color:#EBB9CC;display:grid;place-items:center;padding:0}
.set.done .set-ok{background:linear-gradient(135deg,#FF8FB1,#E8457C);border-color:transparent;color:#fff;box-shadow:0 6px 12px rgba(232,69,124,.3)}
.set.done .stp{background:#FFDDEA}
.ex-f{display:flex;gap:14px;margin-top:2px}
.in{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--p)}textarea.in{resize:vertical;min-height:56px}select.in{background-image:linear-gradient(45deg,transparent 50%,#C21862 50%),linear-gradient(135deg,#C21862 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.ghost-in{border-color:transparent;background:var(--p-xl);font-weight:800;font-size:17px;padding:9px 12px;margin-right:6px}
.note{margin-top:8px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}.fld>span{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-left:-16px;margin-right:-16px;padding:2px 16px 6px;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}
.chipb{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:800;font-size:14px;color:var(--p-d);white-space:nowrap;flex:none}
.chipb.on{background:var(--p);border-color:var(--p);color:#fff}
.seg{display:flex;background:var(--p-xl);border-radius:16px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:12px;font-weight:800;color:var(--muted);font-size:14px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--p-d);box-shadow:0 3px 10px rgba(232,69,124,.18)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + var(--sb));background:linear-gradient(180deg,rgba(255,245,249,0),rgba(255,245,249,.96) 30%)}
.bar-i{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar-s{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:16px;padding:7px 14px;box-shadow:var(--shadow)}.bar-s b{font-size:17px;color:var(--p-d)}.bar-s small{font-size:11px;color:var(--muted);font-weight:700}
.bar .btn{flex:1}
.rest{position:fixed;left:0;right:0;bottom:calc(86px + var(--sb));z-index:35;padding:0 16px;pointer-events:none}
.rest.hidden{display:none}
.rest-i{pointer-events:auto;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#4A1F35,#2E1220);color:#fff;border-radius:22px;padding:10px 12px;box-shadow:0 14px 30px rgba(58,27,42,.4);position:relative;overflow:hidden}
.rest-t{display:flex;flex-direction:column;min-width:64px}.rest-t small{font-size:11px;opacity:.7;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.rest-t b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.rest-p{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}.rest-p i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF8FB1,#FFD0E1);border-radius:99px;transition:width .3s linear}
.rest-i button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;height:38px;min-width:42px;font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 8px}
.rest.over .rest-i{background:linear-gradient(135deg,#FF7FA8,#E8457C);animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.025)}}
.cardio .grid2{margin-top:4px}
.cmp{text-align:center;font-weight:800;color:var(--muted);margin:-2px 0 14px}.cmp.pos{color:var(--p-d)}
.pr{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.pr:last-child{border:0}
.pr>span{width:36px;height:36px;border-radius:12px;background:var(--gold-l);color:var(--gold);display:grid;place-items:center;flex:none}.pr>span .ic{width:19px;height:19px}
.pr b{display:block;font-size:15px}.pr small{color:var(--muted);font-weight:700;font-size:13px}

/* ---- история, прогресс ---- */
.hd{width:46px;text-align:center;display:flex;flex-direction:column;background:var(--p-xl);border-radius:14px;padding:5px 0;flex:none}.hd b{font-family:'Playfair Display',serif;font-size:21px;color:var(--p-d);line-height:1.1}.hd small{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:18px;margin:12px 0 6px}.empty p{margin:0 0 16px}
.empty-i{width:72px;height:72px;border-radius:50%;background:var(--p-xl);color:var(--p);display:grid;place-items:center;margin:0 auto}.empty-i .ic{width:32px;height:32px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:#F8DCE7;stroke-width:1;stroke-dasharray:3 4}.gt{font-size:10.5px;fill:#A9889A;font-weight:700;font-family:'Nunito Variable',sans-serif}.gt.b{fill:#C21862;font-weight:800}
.ln{fill:none;stroke:#E8457C;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.dot{fill:#fff;stroke:#E8457C;stroke-width:2.4}.dot.last{fill:#E8457C;stroke:#fff;stroke-width:2.5}
.bar.zero,.bar{fill:#FFC2D8}.bar.cur{fill:#E8457C}.bar.zero{fill:#FDE6EE}
.tip{font-size:13px;color:var(--muted);background:var(--p-xl);border-radius:12px;padding:8px 12px;margin-top:6px;font-weight:600}.tip b{color:var(--p-d)}
.empty-chart{padding:30px;text-align:center;color:var(--muted);font-weight:700}
.lrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}.lrow:last-child{border:0}.lrow span{color:var(--muted);font-weight:700;text-align:right}
.mvals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mvals span{display:flex;flex-direction:column}.mvals small{color:var(--muted);font-weight:700;font-size:12px}.mvals b{font-size:18px;color:var(--p-d)}
.mrow .card-h{margin-bottom:8px}
.steps{margin:0;padding-left:22px;font-size:15px}.steps li{margin:8px 0}
.pe{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding:6px 0}.pe-b{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0;display:flex;flex-direction:column}.pe-b b{font-size:15px}.pe-b small{color:var(--muted);font-size:12.5px;font-weight:600}
.mv{display:flex;gap:6px}.card-h .ghost-in{flex:1;min-width:0}

/* ---- таббар, шторка, тост ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-around;padding:8px 10px calc(8px + var(--sb));background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid #FCE3ED}
body.nobar .tabs{display:none}
.tabs button{flex:1;max-width:110px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#B9A0AC;font-size:11.5px;font-weight:800;padding:4px 0}
.tabs button .ic{width:25px;height:25px}.tabs button.on{color:var(--p)}
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(58,27,42,.45);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + var(--sb));max-height:90vh;overflow:auto;animation:up .25s ease-out;-webkit-overflow-scrolling:touch}
.sheet h3{margin:0 0 12px;font-size:23px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(110px + var(--sb));transform:translate(-50%,20px);background:#3A1B2A;color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:600px){body{background-attachment:fixed}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.chk.plain.on span{text-decoration:none;color:var(--ink)}
.center-h{display:flex;justify-content:center}.center-h .hr .ic{width:32px;height:32px}
.sheet .fld,.card .fld+.fld{margin-bottom:12px}.sheet .grid2 .fld,.sheet .grid3 .fld{margin-bottom:12px}
.sheet .seg{margin-bottom:2px}.sheet .chk{padding:7px 2px}
.fld>span{line-height:1.2}

/* ---- v2: серия, цикл, пауза ---- */
.hero-w.alt{background:var(--gold-l);color:var(--gold);margin-left:6px;display:inline-flex;align-items:center;gap:4px}.hero-w.alt .ic{width:14px;height:14px}
.cycle{height:7px;border-radius:99px;background:#FFD3E3;margin-top:14px;overflow:hidden}.cycle i{display:block;height:100%;background:linear-gradient(90deg,#FF8FB1,#E8457C);border-radius:99px}
.elapsed{border:0}.elapsed.paused{background:var(--gold-l);color:var(--gold)}
.hearts .hr{background:none}

/* ---- v2: упражнение ---- */
.ex-h .icon-btn.sm{background:var(--p-xl)}.icon-btn.sm.has{background:var(--p);color:#fff}
.ex.skipped{opacity:.65;background:#FFF8FB}.ex.skipped .ex-num{background:#F0DCE5;color:var(--muted)}
.skip-r{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:800;color:var(--muted);font-size:14px}
.ex-tools{display:flex;gap:6px;margin:10px 0 0;justify-content:flex-end}
.setup{display:flex;gap:8px;align-items:center;background:#FFF8EE;color:#8A5516;border-radius:12px;padding:7px 10px;margin-top:10px;font-weight:700;font-size:13px}.setup .ic{width:16px;height:16px;flex:none}
.manual{margin:8px 0 2px;font-size:13px;font-weight:800;color:var(--p-d);background:var(--p-xl);border-radius:10px;padding:6px 10px}
.ex-f.sub{margin-top:0;padding-top:2px;border-top:1px dashed var(--line);flex-wrap:wrap}
.ex-f{flex-wrap:wrap}
.lnk.muted{color:var(--muted)}
.block-h .bh-r{display:flex;align-items:center;gap:8px}.block-h .lnk{padding:4px 2px}
.empty.small{padding:16px;font-size:14px}
.bar-s{min-width:78px}

/* ---- v2: списки с миниатюрами ---- */
.li{display:flex;align-items:center;gap:8px}.li .chk{flex:1;min-width:0}
.li-t{width:42px;height:42px;border-radius:12px;border:0;background:var(--p-xl);color:var(--p);display:grid;place-items:center;flex:none;padding:0;overflow:hidden}.li-t .ic{width:20px;height:20px}
.thumb{width:100%;height:100%;object-fit:cover;display:block;background:var(--p-xl)}
.thumb.full{object-fit:contain;background:#fff}
.techrow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid #FCE3ED;border-radius:18px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);color:var(--ink)}
.techrow>.ic{color:#E7A9C0;width:18px;height:18px}
.tr-i{width:46px;height:46px;border-radius:13px;background:var(--p-xl);color:var(--p);display:grid;place-items:center;flex:none;overflow:hidden}

<script>
'use strict';
/* =====================================================================
   Дневник тренировок - ядро: хелперы, хранилище, план, логика
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ds(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const mondayOf = s => { const d = pd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ds(d); };
const MG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MN = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const fD = s => { const d = pd(s); return d.getDate() + ' ' + MG[d.getMonth()]; };
const fDW = s => { const d = pd(s); return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MG[d.getMonth()]; };
const fDM = s => { const d = pd(s); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1); };
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : NaN; };
const fmt = n => (isFinite(n) ? String(Math.round(n * 100) / 100).replace('.', ',') : '-');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sum = a => a.reduce((x, y) => x + y, 0);
const pl = (n, f) => { n = Math.abs(n) % 100; const m = n % 10; return n > 10 && n < 20 ? f[2] : m > 1 && m < 5 ? f[1] : m === 1 ? f[0] : f[2]; };
const roundTo = (v, step) => Math.round(v / step) * step;

/* ---------- единицы веса: кг / lb (задаются на каждое упражнение) ---------- */
const KG_LB = 2.20462;
const wuOf = e => (e && e.wu === 'lb' ? 'lb' : 'kg');
const wl = e => (wuOf(e) === 'lb' ? 'lb' : 'кг');
const convW = (w, from, to) => (from === to ? w : from === 'kg' ? w * KG_LB : w / KG_LB);
const toKg = (w, u) => (u === 'lb' ? w / KG_LB : w);
const fmtW = n => fmt(Math.round(n * 10) / 10);

/* ---------- хранилище (с запасным вариантом без localStorage) ---------- */
const store = (() => {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
    return { ok: true, get: k => localStorage.getItem(k), set: (k, v) => localStorage.setItem(k, v) };
  } catch (e) { const m = {}; return { ok: false, get: k => (k in m ? m[k] : null), set: (k, v) => { m[k] = v; } }; }
})();
const KEY = 'pinkdiary.v1';

/* ---------- план тренировок (из твоих файлов) ---------- */
const X = (id, name, equip, o) => Object.assign({ id, name, equip: equip || '', type: 'wr', unit: 'повт.', rmin: 12, rmax: 15, sets: 3, step: 2.5, assist: false, warm: true, side: '', wu: 'kg', rest: 0 }, o || {});
function DEFAULT_PLAN() {
  return [
    { id: 'w1', name: 'Тренировка 1', focus: 'Грудь · Бицепсы · Ягодицы', warm: ['lw1', 'lw2'], cardio: { on: true, minutes: 35 }, stretch: { on: true, count: 12 }, blocks: [
      { id: 'b1a', name: 'Грудь', exercises: [

        X('c2', 'Жим', 'тренажёр жим от груди FS-401 / FS-402'),
        X('c3', 'Сведения', 'тренажёр «батерфляй» FS-407'),
        X('c4', 'Разведения', 'сведения локтей с руками за головой', { type: 'reps' })] },
      { id: 'b1b', name: 'Бицепсы', exercises: [
        X('b1', 'Сгибание рук на бицепс', '', { rmin: 12, rmax: 16, step: 1 }),
        X('b2', 'Сгибание рук хватом «молоток»', '', { rmin: 12, rmax: 16, step: 1 }),
        X('b3', 'Сгибания Зоттмана', '', { rmin: 12, rmax: 16, step: 1 })] },
      { id: 'b1c', name: 'Ягодицы', exercises: [
        X('g1', 'Ягодичный мост', 'тренажёр в зоне Girls only', { rmin: 10, rmax: 12 }),
        X('g2', 'Румынская тяга', 'тренажёр «Смит»', { rmin: 10, rmax: 12 }),
        X('g3', 'Разведения ног', 'тренажёр отводящие FS-121', { rmin: 12, rmax: 15 })] }] },
    { id: 'w2', name: 'Тренировка 2', focus: 'Спина · Трицепсы · Пресс · Осанка', warm: ['lw1', 'lw2'], cardio: { on: false, minutes: 35 }, stretch: { on: true, count: 12 }, blocks: [
      { id: 'b2a', name: 'Спина', exercises: [
        X('s1', 'Подтягивания', 'тренажёр гравитрон NR-6851', { rmin: 8, rmax: 10, assist: true }),
        X('s2', 'Горизонтальная тяга', 'тренажёр', { rmin: 10, rmax: 12 }),
        X('s3', 'Тяга гантели в наклоне', '', { rmin: 10, rmax: 12, step: 1 }),
        X('s4', 'Разведения рук', 'тренажёр задние дельты FS-315', { rmin: 12, rmax: 15 })] },
      { id: 'b2b', name: 'Трицепсы', exercises: [
        X('t1', 'Разгибания рук назад стоя в наклоне', '', { rmin: 12, rmax: 16, step: 1 }),
        X('t2', 'Жим гантели из-за головы двумя руками', '', { rmin: 12, rmax: 16, step: 1 }),
        X('t3', 'Обратные отжимания от опоры', '', { type: 'reps', rmin: 12, rmax: 16 })] },
      { id: 'b2c', name: 'Пресс', exercises: [
        X('a1', 'Вакуум', '', { type: 'reps', rmin: 5, rmax: 6 }),
        X('a2', 'Подъём ног в упоре на локтях', 'тренажёр', { type: 'reps', rmin: 10, rmax: 15 }),
        X('a3', 'Планка с подтягиванием колена к груди', '', { type: 'reps', rmin: 10, rmax: 12, side: 'на каждую ногу' })] },
      { id: 'b2d', name: 'Осанка', exercises: [
        X('p1', 'Осанка 1.1', 'видео с Ютуба, с наклоном', { type: 'reps', rmin: 5, rmax: 5, side: 'в каждую сторону' }),
        X('p2', 'Осанка 1.2', 'видео', { type: 'reps', unit: 'счётов', rmin: 10, rmax: 10, side: 'в каждую сторону' }),
        X('p3', 'Осанка 1.3', 'видео', { type: 'reps', rmin: 5, rmax: 7 })] }] },
    { id: 'w3', name: 'Тренировка 3', focus: 'Ноги · Ягодицы · Плечи', warm: ['lw1', 'lw2'], cardio: { on: true, minutes: 35 }, stretch: { on: true, count: 12 }, blocks: [
      { id: 'b3a', name: 'Ноги + икроножные', exercises: [
        X('l1', 'Разгибание ног', 'тренажёр FS-101', { rmin: 12, rmax: 15 }),
        X('l2', 'Гиперэкстензия', 'тренажёр', { rmin: 10, rmax: 12 }),
        X('l3', 'Сведение ног', 'тренажёр приводящие FS-120', { rmin: 13, rmax: 15 }),
        X('l4', 'Подъём на носки сидя', 'тренажёр', { rmin: 15, rmax: 20 }),
        X('l5', 'Сгибание ног лёжа', 'тренажёр FS-103', { rmin: 10, rmax: 12 })] },
      { id: 'b3b', name: 'Ягодицы', exercises: [
        X('m1', 'Жим ногами', 'тренажёр жим ногами сидя FN-108', { rmin: 10, rmax: 12 }),
        X('m2', 'Жим ногами по одной', 'тренажёр жим ногами сидя FN-108', { rmin: 10, rmax: 12, side: 'каждой ногой' }),
        X('m3', 'Толкание платформы назад по одной ноге', 'тренажёр ягодичные FS-117', { rmin: 12, rmax: 15, side: 'каждой ногой' })] },
      { id: 'b3c', name: 'Плечи', exercises: [
        X('h1', 'Жим от плеч', 'тренажёр FS-404', { rmin: 8, rmax: 12 }),
        X('h2', 'Подъёмы гантелей в стороны стоя', '', { rmin: 12, rmax: 15, step: 1 }),
        X('h3', 'Разведения гантелей в наклоне', '', { rmin: 12, rmax: 15, step: 1 }),
        X('h4', 'L-разведения с лёгкими гантелями', '', { rmin: 15, rmax: 20, step: 1 })] }] },
    { id: 'w4', name: 'Тренировка 4', focus: 'Пресс · Осанка', warm: ['lw1', 'lw2'], cardio: { on: false, minutes: 35 }, stretch: { on: true, count: 12 }, blocks: [
      { id: 'b4a', name: 'Пресс', exercises: [
        X('k1', 'Мёртвый жук', '', { type: 'reps', rmin: 10, rmax: 12, side: 'на каждую сторону' }),
        X('k2', 'Скручивания на полу', '', { type: 'reps', rmin: 12, rmax: 15 }),
        X('k3', 'Боковая планка', '', { type: 'time', unit: 'сек', rmin: 30, rmax: 45, side: 'на каждую сторону' })] },
      { id: 'b4b', name: 'Осанка', exercises: [
        X('q1', 'Растяжка грудных мышц', '', { type: 'reps', unit: 'счётов', rmin: 10, rmax: 10, side: 'на каждую сторону' }),
        X('q2', 'Русалка', '', { type: 'reps', rmin: 5, rmax: 5, side: 'на каждую сторону' }),
        X('q3', 'Включение передней зубчатой мышцы', '', { type: 'reps', rmin: 8, rmax: 10 })] }] }
  ];
}

/* ---------- библиотека техники: разминка и растяжка ---------- */
const STRETCH_NAMES = ['Наклон головы, шея и трапеция (сидя)', 'Колено к груди с захватом стопы (лёжа)', 'Квадрицепс лёжа на боку', 'Скрутка лёжа на боку', 'Скрутка лёжа на спине', 'Колени к груди, обнять', 'Поза сфинкса, растяжка пресса', 'Вытягивание рук, таз назад', 'Трицепс за головой (сидя на пятках)', 'Скрутка грудного отдела лёжа на боку', 'Растяжка 11', 'Растяжка 12'];
function defaultLib() {
  const lib = [{ id: 'lw1', cat: 'warm', name: 'Общая разминка', dose: '' }, { id: 'lw2', cat: 'warm', name: 'Упражнение на грудь с резинкой', dose: '' }], tech = {};
  STRETCH_NAMES.forEach((n, i) => { lib.push({ id: 'ls' + (i + 1), cat: 'str', name: n, dose: '' }); if (i < 10) tech['ls' + (i + 1)] = { photos: ['b:s' + (i + 1)] }; });
  return { lib, tech };
}

/* ---------- состояние ---------- */
function defaults() {
  const d = defaultLib();
  return { v: 2, plan: { workouts: DEFAULT_PLAN() }, lib: d.lib, tech: d.tech, sessions: [], measures: [],
    settings: { rest: 90, sound: true, wake: true, start: mondayOf(today()), hideInstall: false, weeklyGoal: 4, cycle: 9 },
    backup: { last: 0 } };
}
function normalize(o) {
  const d = defaults();
  const s = Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}), backup: Object.assign(d.backup, o.backup || {}) });
  if (!o.lib) { const dl = defaultLib(); s.lib = dl.lib; s.tech = Object.assign({}, dl.tech, o.tech || {}); }
  s.tech = s.tech || {}; s.v = 2;
  s.plan.workouts.forEach(w => {
    if (!w.warm) w.warm = w.pre === false ? [] : ['lw1', 'lw2'];
    delete w.pre;
    if (!w.stretch) w.stretch = { on: true, count: 12 };
    if (w.stretch.count == null) w.stretch.count = w.stretch.reps || 12;
    w.blocks.forEach(b => b.exercises.forEach(e => { if (!e.wu) e.wu = 'kg'; if (e.rest == null) e.rest = 0; }));
  });
  return s;
}
function load() {
  try { const raw = store.get(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) { console.error('load', e); }
  return defaults();
}
let S = load();
let saveTimer = 0;
function save() { try { store.set(KEY, JSON.stringify(S)); } catch (e) { toast('Не удалось сохранить: память заполнена. Сделай резервную копию.'); } }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
function flush() { clearTimeout(saveTimer); save(); }

/* ---------- фото: встроенные (b:...) и свои (IndexedDB) ---------- */
const IMG = { db: null, cache: new Map(), ok: true };
function idb() {
  return new Promise((res, rej) => {
    if (IMG.db) return res(IMG.db);
    try { const r = indexedDB.open('pinkdiary-img', 1); r.onupgradeneeded = () => r.result.createObjectStore('imgs'); r.onsuccess = () => { IMG.db = r.result; res(IMG.db); }; r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  });
}
async function imgPut(id, blob) { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('imgs', 'readwrite'); t.objectStore('imgs').put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { IMG.ok = false; IMG.cache.set(id, URL.createObjectURL(blob)); } }
async function imgBlob(id) { try { const db = await idb(); return await new Promise((res, rej) => { const r = db.transaction('imgs').objectStore('imgs').get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); } catch (e) { return null; } }
async function imgDel(id) { IMG.cache.delete(id); try { const db = await idb(); db.transaction('imgs', 'readwrite').objectStore('imgs').delete(id); } catch (e) { } }
async function imgSrc(id) {
  if (!id) return '';
  if (id.startsWith('b:')) return (typeof BUNDLED !== 'undefined' && BUNDLED[id]) || '';
  if (IMG.cache.has(id)) return IMG.cache.get(id);
  const b = await imgBlob(id); if (!b) return '';
  const u = URL.createObjectURL(b); IMG.cache.set(id, u); return u;
}
function hydrate(root) { $$('img[data-img]', root || document).forEach(async im => { if (im.dataset.ok) return; im.dataset.ok = 1; const u = await imgSrc(im.dataset.img); if (u) { im.src = u; im.classList.add('ld'); } }); }
function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const k = Math.min(1, (max || 1100) / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', .78); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); }; im.src = url;
  });
}
const blobToDataUrl = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
async function collectImages() {
  const ids = new Set(); Object.values(S.tech).forEach(t => (t.photos || []).forEach(i => ids.add(i)));
  const out = {}; for (const id of ids) { if (id.startsWith('b:')) continue; const b = await imgBlob(id); if (b) out[id] = await blobToDataUrl(b); }
  return out;
}
async function restoreImages(map) { for (const id of Object.keys(map || {})) { const r = await fetch(map[id]); await imgPut(id, await r.blob()); IMG.cache.delete(id); } }

/* ---------- сессии ---------- */
const cmpAsc = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.startedAt || 0) - (b.startedAt || 0));
const doneSessions = () => S.sessions.filter(s => s.status === 'done').sort(cmpAsc);
const activeSession = () => S.sessions.find(s => s.status === 'active') || null;
const sess = id => { const s = S.sessions.find(x => x.id === id); if (s && !s.pauses) s.pauses = []; return s || null; };
const weekNo = date => Math.max(1, Math.floor((pd(date) - pd(S.settings.start)) / 6048e5) + 1);
const allEx = s => s.layout.blocks.flatMap(b => b.exercises);

/* время тренировки: старт, конец, паузы, ручные перерывы */
const pausesOf = s => s.pauses || [];
const isPaused = s => { const p = pausesOf(s); return p.length > 0 && p[p.length - 1].b == null; };
function netMs(s, now) {
  now = now || Date.now(); const end = s.endedAt || now; let t = end - s.startedAt;
  pausesOf(s).forEach(p => { t -= Math.max(0, (p.b == null ? end : p.b) - p.a); });
  t -= (s.breakMin || 0) * 6e4; return Math.max(0, t);
}
const pauseMs = s => sum(pausesOf(s).map(p => Math.max(0, (p.b == null ? (s.endedAt || Date.now()) : p.b) - p.a)));
const fmtDur = ms => { const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(t % 60); };
const fmtClock = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const clockToMs = (date, hhmm) => { const [h, m] = String(hhmm || '0:0').split(':').map(Number); const d = pd(date); d.setHours(h || 0, m || 0, 0, 0); return d.getTime(); };
const sessMin = s => (s.status === 'done' ? (s.durMin || 0) : Math.round(netMs(s) / 6e4));

/* разминка и растяжка в тренировке (с поддержкой старых записей) */
const LEGACY_WARM = [{ id: 'warmup', name: 'Общая разминка' }, { id: 'band', name: 'Упражнение на грудь с резинкой' }];
const warmItems = s => s.layout.warm || (s.layout.pre ? LEGACY_WARM : []);
const warmDone = (s, id) => !!((s.warm && s.warm[id]) || (s.pre && s.pre[id] && s.pre[id].done));
function setWarm(s, id, v) { s.warm = s.warm || {}; s.warm[id] = v; if (s.pre && s.pre[id]) s.pre[id].done = v; }
const stretchItems = s => (s.layout.stretch && s.layout.stretch.items) || [];
const stretchLegacy = s => !!(s.layout.stretch && s.layout.stretch.on && !s.layout.stretch.items);
const stretchDone = (s, id) => !!(s.stretchDone && s.stretchDone[id]);

function makeSets(e) {
  const a = [];
  if (e.warm) a.push({ warm: true, w: '', r: '', done: false });
  for (let i = 0; i < e.sets; i++) a.push({ warm: false, w: '', r: '', done: false });
  return a;
}
function newSession(w, date) {
  const lib = id => S.lib.find(x => x.id === id);
  const layout = clone({ id: w.id, name: w.name, focus: w.focus, cardio: w.cardio, blocks: w.blocks });
  layout.warm = (w.warm || []).map(lib).filter(Boolean).map(x => ({ id: x.id, name: x.name }));
  layout.stretch = { on: !!w.stretch.on, count: w.stretch.count || 12, items: w.stretch.on ? S.lib.filter(x => x.cat === 'str').map(x => ({ id: x.id, name: x.name })) : [] };
  const s = { id: uid(), wid: w.id, date: date || today(), startedAt: Date.now(), endedAt: null, status: 'active',
    week: weekNo(date || today()), layout, warm: {}, stretchDone: {}, pauses: [], breakMin: 0, entries: {},
    cardio: { done: false, minutes: '', machine: '', level: '', km: '', kcal: '' }, stretch: { done: false },
    energy: 0, rating: 0, note: '', prs: [] };
  allEx(s).forEach(e => { s.entries[e.id] = { sets: makeSets(e), note: '', state: '' }; });
  return s;
}
const validSet = x => num(x.r) > 0;
const workSets = entry => (entry ? entry.sets.filter(x => !x.warm && validSet(x)) : []);
const exComplete = (e, entry) => !!entry && (entry.state === 'done' || (entry.state !== 'skip' && workSets(entry).length >= e.sets));

/* история упражнения: [{s, date, e, work, warm, u}], веса пересчитаны в единицу unit (или последнюю использованную) */
function exHistory(exId, exceptId, unit) {
  const out = [];
  doneSessions().forEach(s => {
    if (s.id === exceptId) return;
    const entry = s.entries[exId]; if (!entry || entry.state === 'skip') return;
    const work = workSets(entry); if (!work.length) return;
    const e = allEx(s).find(x => x.id === exId);
    out.push({ s, date: s.date, e, work, warm: entry.sets.find(x => x.warm && validSet(x)) || null, u: wuOf(e) });
  });
  const tu = unit || (out.length ? out[out.length - 1].u : 'kg');
  out.forEach(h => {
    if (h.u !== tu) {
      const cv = x => Object.assign({}, x, { w: x.w === '' ? '' : String(Math.round(convW(num(x.w) || 0, h.u, tu) * 10) / 10) });
      h.work = h.work.map(cv); if (h.warm) h.warm = cv(h.warm); h.e = Object.assign({}, h.e, { wu: tu });
    }
    h.unit = tu;
  });
  return out;
}

/* рекомендация на сегодня (двойная прогрессия) */
function suggest(e, last) {
  if (!last || !last.work.length) return null;
  const work = last.work, u = wl(e);
  const top = work.length >= e.sets && work.every(x => num(x.r) >= e.rmax);
  const ws = work.map(x => num(x.w) || 0);
  const lastW = e.assist ? Math.min(...ws) : Math.max(...ws);
  const sg = { up: top, w: null, r: null, text: '' };
  if (e.type === 'wr') {
    if (top) {
      sg.w = e.assist ? Math.max(0, lastW - e.step) : lastW + e.step; sg.r = e.rmin;
      sg.text = e.assist ? `Цель: противовес ${fmtW(sg.w)} ${u} × ${e.rmin}. Диапазон закрыт, снижаем помощь` : `Цель: ${fmtW(sg.w)} ${u} × ${e.rmin}. Диапазон закрыт, прибавляем вес`;
    } else sg.text = `Цель: ${fmtW(lastW)} ${u}, добей до ${e.rmax} во всех подходах`;
  } else if (e.type === 'time') {
    sg.text = top ? `Диапазон закрыт. Добавь 5 секунд к прошлому` : `Цель: ${e.rmax} сек в каждом подходе`;
  } else {
    sg.text = top ? `Диапазон закрыт. Усложни: медленнее темп, пауза в пике или вариация` : `Цель: ${e.rmax} ${e.unit} в каждом подходе`;
  }
  return sg;
}

/* подсказки в полях (серым): что было в прошлый раз */
function placeholders(e, entry, i, last, sg) {
  const set = entry.sets[i];
  if (!last) return { w: '', r: '' };
  if (set.warm) {
    if (last.warm) return { w: String(num(last.warm.w) || ''), r: String(last.warm.r) };
    const base = sg && sg.w != null ? sg.w : Math.max(...last.work.map(x => num(x.w) || 0));
    return { w: e.type === 'wr' && base ? String(roundTo(base * 0.5, e.step)) : '', r: String(e.rmax) };
  }
  const j = entry.sets.slice(0, i).filter(x => !x.warm).length;
  const prev = last.work[j] || last.work[last.work.length - 1];
  if (sg && sg.up) return { w: sg.w != null ? String(sg.w) : '', r: String(sg.r != null ? sg.r : (num(prev.r) || '')) };
  return { w: num(prev.w) ? String(num(prev.w)) : (e.type === 'wr' ? '0' : ''), r: String(num(prev.r)) };
}

/* ---------- метрики, рекорды ---------- */
const e1rm = (w, r) => w * (1 + r / 30);
function setScore(e, x) {
  const r = num(x.r), w = toKg(num(x.w) || 0, wuOf(e));
  if (e.type === 'wr') return e.assist ? -w * 1000 + r : (w > 0 ? e1rm(w, r) : r / 1000);
  return r;
}
function bestSet(e, sets) { let b = null, bs = -Infinity; sets.forEach(x => { const sc = setScore(e, x); if (sc > bs) { bs = sc; b = x; } }); return b; }
function setText(e, x) {
  if (!x) return '-';
  if (e.type === 'wr') return `${fmtW(num(x.w) || 0)} ${wl(e)} × ${fmt(num(x.r))}`;
  return `${fmt(num(x.r))} ${e.type === 'time' ? 'сек' : e.unit}`;
}
function recomputePRs() {
  const best = {};
  doneSessions().forEach(s => {
    const prs = [];
    allEx(s).forEach(e => {
      const en = s.entries[e.id]; if (!en || en.state === 'skip') return;
      const work = workSets(en); if (!work.length) return;
      const b = bestSet(e, work), sc = setScore(e, b);
      if (best[e.id] !== undefined && sc > best[e.id] + 1e-9) prs.push({ exId: e.id, name: e.name, text: setText(e, b) });
      if (best[e.id] === undefined || sc > best[e.id]) best[e.id] = sc;
    });
    s.prs = prs;
  });
}
function sessionStats(s) {
  let sets = 0, planned = 0, vol = 0, reps = 0, exDone = 0, exAll = 0, exSkip = 0, exManual = 0;
  allEx(s).forEach(e => {
    const en = s.entries[e.id]; if (!en) return; exAll++;
    if (en.state === 'skip') { exSkip++; return; }
    const w = workSets(en); planned += e.sets; sets += w.length; reps += sum(w.map(x => num(x.r)));
    if (e.type === 'wr' && !e.assist) vol += sum(w.map(x => toKg(num(x.w) || 0, wuOf(e)) * num(x.r)));
    if (exComplete(e, en)) { exDone++; if (en.state === 'done' && w.length < e.sets) exManual++; }
  });
  return { sets, planned, vol, reps, exDone, exAll, exSkip, exManual, exLeft: exAll - exSkip };
}
/* средняя пауза между подходами по отметкам времени */
function avgGap(s) {
  const ts = []; Object.values(s.entries).forEach(en => en.sets.forEach(x => { if (x.t) ts.push(x.t); })); ts.sort((a, b) => a - b);
  const g = []; for (let i = 1; i < ts.length; i++) { const d = ts[i] - ts[i - 1]; if (d > 5000 && d < 20 * 6e4) g.push(d); }
  return g.length ? sum(g) / g.length : 0;
}
function metricsFor(e) {
  const W = a => a.map(x => num(x.w) || 0), R = a => a.map(x => num(x.r)), u = ' ' + wl(e);
  if (e.type === 'wr' && !e.assist) return [
    { k: 'maxw', l: 'Рабочий вес', u, f: a => Math.max(...W(a)) },
    { k: 'vol', l: 'Объём', u, f: a => sum(a.map(x => (num(x.w) || 0) * num(x.r))) },
    { k: 'e1', l: 'Расчётный 1ПМ', u, f: a => Math.max(...a.map(x => e1rm(num(x.w) || 0, num(x.r)))) }];
  if (e.type === 'wr') return [
    { k: 'minw', l: 'Противовес', u, down: true, f: a => Math.min(...W(a)) },
    { k: 'best', l: 'Лучший подход', u: ' повт.', f: a => Math.max(...R(a)) },
    { k: 'total', l: 'Всего повторений', u: ' повт.', f: a => sum(R(a)) }];
  const un = e.type === 'time' ? ' сек' : ' ' + e.unit;
  return [{ k: 'best', l: 'Лучший подход', u: un, f: a => Math.max(...R(a)) }, { k: 'total', l: 'Сумма по подходам', u: un, f: a => sum(R(a)) }];
}

/* ---------- серия недель, подходы по группам ---------- */
function weekStreak() {
  const goal = Math.max(1, S.settings.weeklyGoal || 4), d = doneSessions();
  const cnt = m => d.filter(s => s.date >= m && s.date <= addDays(m, 6)).length;
  let mon = mondayOf(today()), n = 0;
  if (cnt(mon) >= goal) n++;
  mon = addDays(mon, -7);
  while (cnt(mon) >= goal) { n++; mon = addDays(mon, -7); }
  return n;
}
function groupSets(from, to) {
  const m = {};
  doneSessions().filter(s => s.date >= from && s.date <= to).forEach(s => s.layout.blocks.forEach(b => {
    const c = sum(b.exercises.map(e => (s.entries[e.id] && s.entries[e.id].state !== 'skip') ? workSets(s.entries[e.id]).length : 0));
    if (c) m[b.name] = (m[b.name] || 0) + c;
  }));
  return m;
}
function sessionText(s) {
  const st = sessionStats(s); let t = `${s.layout.name} · ${fDW(s.date)}\n`;
  t += `Время: ${fmtClock(s.startedAt)}${s.endedAt ? '–' + fmtClock(s.endedAt) : ''}, ${sessMin(s)} мин. Подходов: ${st.sets}, объём: ${fmt(Math.round(st.vol))} кг\n`;
  s.layout.blocks.forEach(b => { t += `\n${b.name}\n`; b.exercises.forEach(e => { const en = s.entries[e.id]; if (!en) return;
    if (en.state === 'skip') { t += `- ${e.name}: пропущено\n`; return; }
    const w = workSets(en);
    t += `- ${e.name}: ${w.length ? w.map(x => e.type === 'wr' ? fmtW(num(x.w) || 0) + '×' + fmt(num(x.r)) : fmt(num(x.r))).join(', ') + (e.type === 'wr' ? ' ' + wl(e) : '') : (en.state === 'done' ? 'выполнено без записи' : 'нет данных')}\n`; }); });
  if (s.cardio && num(s.cardio.minutes) > 0) t += `\nКардио: ${s.cardio.minutes} мин${s.cardio.machine ? ', ' + s.cardio.machine : ''}\n`;
  if (s.note) t += `\nЗаметка: ${s.note}\n`;
  return t;
}

/* ---------- демо-данные для просмотра графиков ---------- */
function makeDemo() {
  const start = mondayOf(addDays(today(), -70));
  const offs = [0, 1, 3, 4]; let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const hash = id => [...id].reduce((a, c) => a + c.charCodeAt(0), 0);
  for (let wk = 0; wk < 10; wk++) offs.forEach((off, wi) => {
    const date = addDays(start, wk * 7 + off);
    if (date >= today() || (wk * 4 + wi) % 11 === 7) return;
    const w = S.plan.workouts[wi]; if (!w) return;
    const s = newSession(w, date); s.demo = true; s.status = 'done'; s.week = wk + 1;
    s.startedAt = pd(date).getTime() + 18 * 36e5 + Math.round(rnd() * 6) * 6e5; s.breakMin = 3 + Math.round(rnd() * 4);
    s.durMin = 55 + Math.round(rnd() * 20); s.endedAt = s.startedAt + (s.durMin + s.breakMin) * 6e4;
    s.energy = 3 + Math.round(rnd() * 2); s.rating = 3 + Math.round(rnd() * 2);
    warmItems(s).forEach(x => setWarm(s, x.id, true)); stretchItems(s).slice(0, 10).forEach(x => { s.stretchDone[x.id] = true; });
    if (w.cardio.on) s.cardio = { done: true, minutes: String(35 + (wk % 3) * 5), machine: 'Орбитрек', level: String(6 + (wk >> 1)), km: '', kcal: String(280 + wk * 8) };
    let tt = s.startedAt + 8 * 6e4;
    allEx(s).forEach(e => {
      const h = hash(e.id); const base = e.assist ? 40 : (e.step === 1 ? 3 + (h % 6) * 2 : 10 + (h % 8) * 5);
      const step = e.step, span = Math.max(0, e.rmax - e.rmin);
      s.entries[e.id].sets.forEach((x, i) => {
        tt += 75000 + Math.round(rnd() * 40000); x.t = tt;
        if (x.warm) { x.w = e.type === 'wr' ? String(roundTo(base * 0.5, step)) : ''; x.r = String(e.rmax); x.done = true; return; }
        const j = i - (e.warm ? 1 : 0);
        x.r = String(e.rmin + ((wk * 2 + j) % (span + 1)));
        if (e.type === 'time') x.r = String(e.rmin + Math.min(span, wk + j));
        if (e.type === 'wr') x.w = String(e.assist ? Math.max(0, base - Math.floor(wk / 2) * step) : base + Math.floor(wk / 3) * step);
        x.done = true;
      });
    });
    S.sessions.push(s);
  });
  [0, 2, 4, 6, 8, 9].forEach(k => {
    const date = addDays(start, k * 7 + 6); if (date >= today()) return;
    S.measures.push({ id: uid(), date, demo: true, weight: String(Math.round((64 - k * 0.35) * 10) / 10), waist: String(70 - k * 0.5), hips: String(97 - k * 0.4), glutes: String(98 + k * 0.4), chest: '', arm: '' });
  });
  recomputePRs();
}

/* ---------- графики (чистый SVG, без библиотек) ---------- */
let gid = 0;
function niceTicks(mn, mx, n = 4) {
  const span = mx - mn || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const st = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => k >= raw) || raw;
  const a = Math.floor(mn / st) * st, b = Math.ceil(mx / st) * st, t = [];
  for (let v = a; v <= b + st / 2; v += st) t.push(Math.round(v * 1000) / 1000);
  return t;
}
function lineChart(pts, o = {}) {
  const id = 'c' + (++gid), W = 340, H = o.h || 190, L = 38, R = 14, T = 16, B = 28, u = o.u || '';
  if (!pts.length) return `<div class="empty-chart">Пока нет данных</div>`;
  const ys = pts.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mn === mx) { mn -= 1; mx += 1; }
  const ticks = niceTicks(mn - (mx - mn) * .08, mx + (mx - mn) * .08, 3);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const X = i => (pts.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (pts.length - 1));
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo || 1));
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = line + ` L${X(pts.length - 1).toFixed(1)} ${H - B} L${X(0).toFixed(1)} ${H - B} Z`;
  let g = '';
  ticks.forEach(t => { const y = Y(t).toFixed(1); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="gl"/><text x="${L - 6}" y="${+y + 4}" text-anchor="end" class="gt">${fmt(t)}</text>`; });
  const idx = pts.length <= 4 ? pts.map((_, i) => i) : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
  idx.forEach(i => { g += `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 && pts.length > 1 ? 'start' : i === pts.length - 1 && pts.length > 1 ? 'end' : 'middle'}" class="gt">${esc(pts[i].x)}</text>`; });
  const dots = pts.map((p, i) => {
    const last = i === pts.length - 1;
    return `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${last ? 5.5 : 3.6}" class="${last ? 'dot last' : 'dot'}"/><circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="14" fill="transparent" data-tip="${esc(p.x + ': ' + fmt(p.y) + u)}" data-tipid="${id}"/>`;
  }).join('');
  const lastP = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8457C" stop-opacity=".30"/><stop offset="1" stop-color="#E8457C" stop-opacity="0"/></linearGradient></defs>${g}${pts.length > 1 ? `<path d="${area}" fill="url(#${id}g)"/>` : ''}<path d="${line}" class="ln"/>${dots}</svg><div class="tip" id="${id}">Последнее значение: <b>${fmt(lastP.y)}${u}</b> (${esc(lastP.x)}). Нажми на точку, чтобы увидеть другое.</div>`;
}
function barChart(items, o = {}) {
  const W = 340, H = o.h || 150, L = 8, R = 8, T = 22, B = 24;
  const mx = Math.max(1, ...items.map(i => i.v)), n = items.length, bw = (W - L - R) / n;
  let g = '';
  items.forEach((it, i) => {
    const h = (H - T - B) * (it.v / mx), x = L + i * bw + bw * .18, w = bw * .64, y = H - B - h;
    g += `<rect x="${x.toFixed(1)}" y="${(it.v ? y : H - B - 2).toFixed(1)}" width="${w.toFixed(1)}" height="${(it.v ? h : 2).toFixed(1)}" rx="5" class="${it.cur ? 'bar cur' : it.v ? 'bar' : 'bar zero'}"/>`;
    if (it.v) g += `<text x="${(x + w / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" class="gt b">${fmt(it.v)}</text>`;
    if ((n - 1 - i) % (n > 8 ? 2 : 1) === 0) g += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle" class="gt">${esc(it.l)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
function openSheet(html) { $('#sheet').innerHTML = `<div class="sheet-wrap" data-act="sclose"><div class="sheet">${html}</div></div>`; document.body.classList.add('noscroll'); hydrate($('#sheet')); }
function closeSheet() { $('#sheet').innerHTML = ''; document.body.classList.remove('noscroll'); }

/* помощники по технике */
const techOf = id => S.tech[id] || {};
const hasTech = id => { const t = S.tech[id]; return !!(t && (t.text || t.setup || t.mistakes || t.link || (t.photos && t.photos.length))); };
const libOf = id => S.lib.find(x => x.id === id);
const libKey = id => ({ warmup: 'lw1', band: 'lw2' }[id] || id);
function exById(id) {
  for (const w of S.plan.workouts) for (const b of w.blocks) { const e = b.exercises.find(x => x.id === id); if (e) return e; }
  for (const s of S.sessions) { const e = allEx(s).find(x => x.id === id); if (e) return e; }
  return null;
}
const thumb = (id, cls) => `<img class="thumb ${cls || ''}" data-img="${id}" alt="">`;

/* ---------- Главная ---------- */
function nextWorkout() {
  const d = doneSessions(); if (!d.length) return S.plan.workouts[0];
  const i = S.plan.workouts.findIndex(w => w.id === d[d.length - 1].wid);
  return S.plan.workouts[(i + 1) % S.plan.workouts.length] || S.plan.workouts[0];
}
function viewHome() {
  const done = doneSessions(), act = activeSession(), td = today(), mon = mondayOf(td);
  const wk = weekNo(td), cyc = S.settings.cycle || 0, goal = S.settings.weeklyGoal || 4, weekS = done.filter(s => s.date >= mon && s.date <= addDays(mon, 6));
  const nxt = nextWorkout(), streak = weekStreak();
  const days = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map((l, i) => { const d = addDays(mon, i), has = weekS.some(s => s.date === d);
    return `<div class="wd ${has ? 'has' : ''} ${d === td ? 'td' : ''}"><i>${has ? I.check : ''}</i><span>${l}</span></div>`; }).join('');
  const m30 = done.filter(s => s.date >= addDays(td, -30)), prs30 = sum(m30.map(s => (s.prs || []).length));
  let h = `<header class="hero"><div class="hero-s">${fDW(td)}</div><h1 class="display">Мой дневник<br>тренировок</h1><span class="hero-w">Неделя ${wk}${cyc ? ' из ' + cyc : ''}</span>${streak ? `<span class="hero-w alt">${I.flame}Серия ${streak} ${pl(streak, ['неделя', 'недели', 'недель'])}</span>` : ''}${cyc ? `<div class="cycle"><i style="width:${Math.min(100, wk / cyc * 100)}%"></i></div>` : ''}</header>`;
  if (!store.ok) h += `<div class="warn">Память браузера недоступна: данные не сохранятся после закрытия. Открой приложение из Safari или с экрана «Домой», либо делай копии в разделе «Данные».</div>`;
  if (cyc && wk > cyc) h += `<div class="warn soft">Цикл из ${cyc} недель закончился. Самое время обновить план. <button class="lnk" data-act="newCycle">Начать новый цикл с этой недели</button></div>`;
  if (S.sessions.some(s => s.demo)) h += `<div class="warn soft">Показаны демо-данные. <button class="lnk" data-act="demoDel">Удалить демо</button></div>`;
  if (act) { const st = sessionStats(act); h += `<button class="resume" data-act="resume"><span class="rs-i">${I.play}</span><span><b>Продолжить: ${esc(act.layout.name)}</b><small>${fD(act.date)} · упражнений ${st.exDone} из ${st.exLeft}${isPaused(act) ? ' · пауза' : ''}</small></span>${I.chev}</button>`; }
  h += `<section class="card week"><div class="card-h"><b>Эта неделя</b><span class="chip">${weekS.length} из ${goal}</span></div><div class="wds">${days}</div></section>`;
  if (!act) h += `<section class="next"><div class="next-l">Следующая по плану</div><div class="next-t display">${esc(nxt.name)}</div><div class="next-f">${esc(nxt.focus)}</div><button class="btn light block" data-act="start" data-w="${nxt.id}">Начать тренировку</button></section>`;
  h += `<div class="sec-h">Все тренировки</div>`;
  S.plan.workouts.forEach(w => {
    const dd = done.filter(s => s.wid === w.id), last = dd[dd.length - 1];
    h += `<button class="wcard" data-act="start" data-w="${w.id}"><span class="wc-i">${I.dumb}</span><span class="wc-b"><b>${esc(w.name)}</b><small>${esc(w.focus)}</small><em>${last ? 'Последняя: ' + fD(last.date) + ' · всего ' + dd.length : 'Ещё не было'}</em></span>${I.chev}</button>`;
  });
  h += `<div class="tiles"><div class="tile"><b class="display">${done.length}</b><span>тренировок<br>всего</span></div><div class="tile"><b class="display">${m30.length}</b><span>за 30 дней</span></div><div class="tile"><b class="display">${prs30}</b><span>рекордов<br>за 30 дней</span></div></div>`;
  const bk = S.backup.last, need = done.length > 0 && (Date.now() - bk > 7 * 864e5) && !S.sessions.every(s => s.demo);
  if (need) h += `<div class="card backup"><b>Сделай резервную копию</b><p>${bk ? 'Последняя копия была ' + Math.floor((Date.now() - bk) / 864e5) + ' дн. назад.' : 'Копий ещё не было.'} Если очистить данные Safari, история пропадёт. Копия занимает 5 секунд.</p><button class="btn sm" data-act="exportShare">Сохранить копию</button></div>`;
  if (!isStandalone() && isIOS() && !S.settings.hideInstall) h += `<div class="card install"><b>Установи как приложение</b><p>В Safari нажми «Поделиться», затем «На экран “Домой”». Так оно откроется без адресной строки и будет работать без интернета.</p><div class="row"><button class="btn sm ghost" data-act="go" data-v="install">Подробнее</button><button class="btn sm ghost" data-act="hideInstall">Скрыть</button></div></div>`;
  return h;
}

/* ---------- Экран тренировки ---------- */
const elapsedText = s => (s.status === 'active' ? (isPaused(s) ? 'пауза ' : '') + fmtDur(netMs(s)) : sessMin(s) + ' мин');
function hearts(n, kind) { let h = ''; for (let i = 1; i <= 5; i++) h += `<button class="hr ${i <= n ? 'on' : ''}" data-act="heart" data-k="${kind}" data-n="${i}">${i <= n ? I.heartF : I.heart}</button>`; return `<div class="hearts">${h}</div>`; }
function stepper(f, val, ph, step) { return `<div class="stp"><button data-act="dec" data-f="${f}" data-step="${step}" tabindex="-1" aria-label="меньше">−</button><input data-f="${f}" inputmode="decimal" autocomplete="off" enterkeyhint="next" value="${esc(String(val).replace('.', ','))}" placeholder="${esc(String(ph).replace('.', ','))}"><button data-act="inc" data-f="${f}" data-step="${step}" tabindex="-1" aria-label="больше">+</button></div>`; }
const tgtText = e => `${e.sets} × ${e.rmin === e.rmax ? e.rmin : e.rmin + '–' + e.rmax} ${e.type === 'time' ? 'сек' : e.unit}${e.side ? ' · ' + e.side : ''}`;

function exCard(s, b, e, k) {
  const entry = s.entries[e.id], sm = ui.struct;
  const hist = exHistory(e.id, s.id, wuOf(e)), last = hist[hist.length - 1] || null, sg = suggest(e, last);
  const unit = e.type === 'time' ? 'сек' : e.unit, nw = e.type !== 'wr';
  const wlab = (e.assist ? 'противовес, ' : 'вес, ') + wl(e);
  const stt = entry.state || '', complete = exComplete(e, entry), skipped = stt === 'skip';
  const setup = (S.tech[e.id] || {}).setup;
  const head = `<div class="ex-h"><div class="ex-num">${complete ? I.check : skipped ? I.skip : k}</div><div class="ex-t"><b>${esc(e.name)}</b>${e.equip ? `<small>${esc(e.equip)}</small>` : ''}<em>${tgtText(e)}</em></div><button class="icon-btn sm ${hasTech(e.id) ? 'has' : ''}" data-act="techOpen" data-kind="ex" data-id="${e.id}" aria-label="техника">${I.book}</button><button class="icon-btn sm" data-act="exHist" data-ex="${e.id}" aria-label="история">${I.trend}</button></div>`;
  const tools = sm ? `<div class="ex-tools"><button class="icon-btn sm" data-act="sUp" data-b="${b.id}" data-ex="${e.id}">${I.up}</button><button class="icon-btn sm" data-act="sDown" data-b="${b.id}" data-ex="${e.id}">${I.down}</button><button class="icon-btn sm" data-act="sEdit" data-b="${b.id}" data-ex="${e.id}">${I.edit}</button><button class="icon-btn sm" data-act="sDel" data-b="${b.id}" data-ex="${e.id}">${I.trash}</button></div>` : '';
  if (skipped) return `<article class="ex skipped" data-exid="${e.id}">${head}${tools}<div class="skip-r"><span>Пропущено</span><button class="lnk" data-act="exState" data-ex="${e.id}" data-v="skip">вернуть</button></div></article>`;
  let rows = '', wn = 0;
  entry.sets.forEach((x, i) => {
    if (!x.warm) wn++;
    const p = placeholders(e, entry, i, last, sg), ok = x.done && validSet(x);
    rows += `<div class="set ${x.warm ? 'warm' : ''} ${ok ? 'done' : ''} ${nw ? 'nw' : ''}" data-ex="${e.id}" data-i="${i}"><div class="set-n" title="${x.warm ? 'разминочный подход' : ''}">${x.warm ? 'Р' : wn}</div>${nw ? '' : stepper('w', x.w, p.w, e.step)}${stepper('r', x.r, p.r, e.type === 'time' ? 5 : 1)}<button class="set-ok" data-act="ok" aria-label="готово">${I.check}</button></div>`;
  });
  let hint = '';
  if (last) hint = `<div class="last">Прошлый раз, ${fD(last.date)}: <b>${last.work.map(x => e.type === 'wr' ? fmtW(num(x.w) || 0) + '×' + fmt(num(x.r)) : fmt(num(x.r))).join(' · ')}</b>${e.type === 'wr' ? ' ' + wl(e) : ''}</div><div class="goal ${sg.up ? 'up' : ''}">${sg.up ? I.trend : ''}<span>${esc(sg.text)}</span></div>`;
  else hint = `<div class="goal first"><span>Первый раз: подбери вес с запасом 1–2 повторения в конце подхода.</span></div>`;
  const noteOpen = entry.note || ui.notes.has(e.id);
  const anyEmpty = entry.sets.some(x => !validSet(x));
  return `<article class="ex ${complete ? 'complete' : ''}" data-exid="${e.id}">${head}${tools}${setup ? `<div class="setup">${I.gear}<span>${esc(setup)}</span></div>` : ''}${hint}${stt === 'done' && !workSets(entry).length ? `<div class="manual">Отмечено выполненным без записи подходов</div>` : ''}<div class="set-head ${nw ? 'nw' : ''}"><span></span>${nw ? '' : `<span>${wlab}</span>`}<span>${unit}</span><span></span></div>${rows}
  <div class="ex-f"><button class="lnk" data-act="addset" data-ex="${e.id}">+ подход</button><button class="lnk" data-act="delset" data-ex="${e.id}">− подход</button><button class="lnk" data-act="note" data-ex="${e.id}">${noteOpen ? 'скрыть заметку' : 'заметка'}</button></div>
  <div class="ex-f sub">${last && anyEmpty ? `<button class="lnk" data-act="fill" data-ex="${e.id}">как раньше</button>` : ''}<button class="lnk" data-act="exState" data-ex="${e.id}" data-v="done">${stt === 'done' ? 'снять «выполнено»' : 'выполнено без записи'}</button><button class="lnk muted" data-act="exState" data-ex="${e.id}" data-v="skip">пропустить</button></div>
  ${noteOpen ? `<textarea class="in note" rows="2" data-f="enote" data-ex="${e.id}" placeholder="Как шло, какая настройка тренажёра, что поправить...">${esc(entry.note)}</textarea>` : ''}</article>`;
}
function liRow(id, name, on, tog, del, photoId) {
  const key = libKey(id), p = photoId || ((S.tech[key] || {}).photos || [])[0];
  return `<div class="li"><button class="li-t" data-act="techOpen" data-kind="lib" data-id="${key}" aria-label="техника">${p ? thumb(p) : I.book}</button><button class="chk ${on ? 'on' : ''}" data-act="${tog}" data-id="${id}"><i>${I.check}</i><span>${esc(name)}</span></button>${del ? `<button class="icon-btn sm" data-act="${del}" data-id="${id}">${I.trash}</button>` : ''}</div>`;
}
function viewWorkout() {
  const s = sess(ui.sid); if (!s) { ui.view = 'home'; return viewHome(); }
  const L = s.layout, act = s.status === 'active', st = sessionStats(s), sm = ui.struct;
  let h = `<div class="topbar"><button class="icon-btn" data-act="back" aria-label="назад">${I.back}</button><button class="tb-t" data-act="editDate"><b>${esc(L.name)}</b><small>${fDW(s.date)} · неделя ${s.week} ${I.edit}</small></button><button class="elapsed ${isPaused(s) ? 'paused' : ''}" id="elapsed" data-act="timeSheet">${elapsedText(s)}</button><button class="icon-btn" data-act="wmenu" aria-label="меню">${I.dots}</button></div>`;
  if (sm) h += `<div class="warn soft">Режим правки: меняй порядок, состав и параметры упражнений. Изменения коснутся только этой тренировки. <button class="lnk" data-act="structOff">Готово</button></div>`;
  h += `<div class="card energy"><span>Энергия сегодня</span>${hearts(s.energy, 'energy')}</div>`;
  const wi = warmItems(s);
  if (wi.length || sm) h += `<section class="card"><div class="card-h"><b class="display">Разминка</b><span class="chip">${wi.filter(x => warmDone(s, x.id)).length} / ${wi.length}</span></div>${wi.map(x => liRow(x.id, x.name, warmDone(s, x.id), 'warmTog', sm ? 'sWarmDel' : '')).join('')}${sm ? `<button class="lnk" data-act="sWarmAdd">+ добавить из библиотеки</button>` : ''}</section>`;
  let k = 0;
  L.blocks.forEach(b => {
    const dn = b.exercises.filter(e => exComplete(e, s.entries[e.id])).length;
    h += `<div class="block-h"><span class="display">${esc(b.name)}</span><span class="bh-r">${sm ? `<button class="icon-btn sm" data-act="sBlkRen" data-b="${b.id}">${I.edit}</button><button class="icon-btn sm" data-act="sAddEx" data-b="${b.id}">${I.plus}</button><button class="icon-btn sm" data-act="sBlkDel" data-b="${b.id}">${I.trash}</button>` : `<button class="lnk" data-act="blkDone" data-b="${b.id}">отметить всё</button>`}<span class="chip">${dn} / ${b.exercises.length}</span></span></div>`;
    b.exercises.forEach(e => { k++; if (s.entries[e.id]) h += exCard(s, b, e, k); });
    if (sm && !b.exercises.length) h += `<div class="empty small">В блоке пока нет упражнений. Нажми + в заголовке.</div>`;
  });
  if (L.cardio && L.cardio.on) {
    const c = s.cardio, machines = ['Дорожка', 'Орбитрек', 'Велотренажёр', 'Эллипс'];
    h += `<section class="card cardio"><div class="card-h"><b class="display">Кардио</b><span class="chip">цель ${L.cardio.minutes}+ мин</span></div>
      <div class="chips">${machines.map(m => `<button class="chipb ${c.machine === m ? 'on' : ''}" data-act="machine" data-v="${m}">${m}</button>`).join('')}</div>
      <div class="grid2"><label class="fld"><span>Минут</span><input class="in" data-f="c.minutes" inputmode="decimal" value="${esc(c.minutes)}" placeholder="${L.cardio.minutes}"></label>
      <label class="fld"><span>Уровень / скорость</span><input class="in" data-f="c.level" value="${esc(c.level)}" placeholder="например 8"></label>
      <label class="fld"><span>Километры</span><input class="in" data-f="c.km" inputmode="decimal" value="${esc(c.km)}" placeholder="-"></label>
      <label class="fld"><span>Ккал</span><input class="in" data-f="c.kcal" inputmode="decimal" value="${esc(c.kcal)}" placeholder="-"></label></div></section>`;
  }
  if (L.stretch && L.stretch.on) {
    if (stretchLegacy(s)) h += `<section class="card"><button class="chk ${s.stretch.done ? 'on' : ''}" data-act="chk" data-k="stretch"><i>${I.check}</i><span>Растяжка · ${L.stretch.count || L.stretch.reps || 12} упражнений</span></button></section>`;
    else {
      const it = stretchItems(s), dn = it.filter(x => stretchDone(s, x.id)).length;
      h += `<section class="card"><div class="card-h"><b class="display">Растяжка</b><span class="chip">${dn} / ${it.length}</span></div>${it.map(x => liRow(x.id, x.name, stretchDone(s, x.id), 'stTog', sm ? 'sStDel' : '')).join('')}<div class="row"><button class="lnk" data-act="stAll">отметить все</button>${sm ? `<button class="lnk" data-act="sStAdd">+ добавить</button>` : ''}</div></section>`;
    }
  }
  if (sm) h += `<section class="card"><div class="card-h"><b>Состав тренировки</b></div><button class="chk plain ${L.cardio && L.cardio.on ? 'on' : ''}" data-act="sTog" data-k="cardio"><i>${I.check}</i><span>Кардио</span></button><button class="chk plain ${L.stretch && L.stretch.on ? 'on' : ''}" data-act="sTog" data-k="stretch"><i>${I.check}</i><span>Растяжка</span></button><button class="btn sm ghost" style="margin-top:8px" data-act="sBlkNew">+ Блок (группа мышц)</button></section>`;
  h += `<section class="card"><label class="fld"><span>Заметка к тренировке</span><textarea class="in" rows="2" data-f="snote" placeholder="Сон, самочувствие, что поменять в следующий раз">${esc(s.note)}</textarea></label></section>`;
  h += `<div class="bar" id="bar"><div class="bar-i"><div class="bar-s"><b id="barSets">${st.exDone} / ${st.exLeft}</b><small>упражнений</small></div><button class="btn" data-act="finish">${act ? 'Завершить тренировку' : 'Готово'}</button></div></div>`;
  return h;
}

/* ---------- Итоги ---------- */
function viewSummary() {
  const s = sess(ui.sid); if (!s) return viewHome();
  const st = sessionStats(s), gap = avgGap(s);
  const prev = doneSessions().filter(x => x.wid === s.wid && cmpAsc(x, s) < 0).pop();
  let cmp = '';
  if (prev && st.vol > 0) { const pv = sessionStats(prev).vol; if (pv > 0) { const d = Math.round((st.vol - pv) / pv * 100); cmp = `<div class="cmp ${d >= 0 ? 'pos' : ''}">${d >= 0 ? '+' : ''}${d}% объёма к прошлой тренировке</div>`; } }
  const prs = (s.prs || []);
  return `<header class="hero sm"><div class="trophy">${I.trophy}</div><h1 class="display">Тренировка завершена</h1><div class="hero-s">${esc(s.layout.name)} · ${fDW(s.date)}</div></header>
  <div class="tiles"><div class="tile"><b class="display">${s.durMin || '-'}</b><span>минут<br>активно</span></div><div class="tile"><b class="display">${st.exDone}/${st.exLeft}</b><span>упражнений</span></div><div class="tile"><b class="display">${fmt(Math.round(st.vol))}</b><span>кг объём</span></div></div>${cmp}
  <section class="card"><div class="card-h"><b>Время</b><button class="lnk" data-act="timeSheet">изменить</button></div><div class="lrow"><b>Начало и конец</b><span>${fmtClock(s.startedAt)}–${fmtClock(s.endedAt)}</span></div><div class="lrow"><b>Паузы и перерывы</b><span>${Math.round((pauseMs(s) + (s.breakMin || 0) * 6e4) / 6e4)} мин</span></div>${gap ? `<div class="lrow"><b>Средняя пауза между подходами</b><span>${fmtDur(gap)}</span></div>` : ''}<div class="lrow"><b>Подходов записано</b><span>${st.sets}${st.exSkip ? ' · пропущено упражнений: ' + st.exSkip : ''}${st.exManual ? ' · без записи: ' + st.exManual : ''}</span></div></section>
  ${prs.length ? `<section class="card prs"><div class="card-h"><b class="display">Новые рекорды</b><span class="chip gold">${prs.length}</span></div>${prs.map(p => `<div class="pr"><span>${I.trophy}</span><div><b>${esc(p.name)}</b><small>${esc(p.text)}</small></div></div>`).join('')}</section>` : ''}
  <section class="card"><div class="card-h"><b>Как прошла тренировка</b></div><div class="center-h">${hearts(s.rating, 'rating')}</div><label class="fld" style="margin-top:12px"><span>Заметка</span><textarea class="in" rows="2" data-f="snote">${esc(s.note)}</textarea></label></section>
  <div class="row" style="margin-top:6px"><button class="btn" style="flex:1" data-act="home">Готово</button><button class="btn ghost" data-act="shareSess">${I.share}</button></div>`;
}

/* ---------- История ---------- */
function calMonth() {
  const cm = ui.cm || today().slice(0, 7), [y, m] = cm.split('-').map(Number), first = new Date(y, m - 1, 1);
  const off = (first.getDay() + 6) % 7, days = new Date(y, m, 0).getDate(), done = doneSessions().filter(s => s.date.startsWith(cm));
  let cells = ''; for (let i = 0; i < off; i++) cells += '<div class="cd-e"></div>';
  for (let d = 1; d <= days; d++) {
    const ds_ = cm + '-' + pad(d), ss = done.filter(s => s.date === ds_);
    cells += `<button class="cday ${ds_ === today() ? 'td' : ''} ${ss.length ? 'has' : ''}" ${ss.length ? `data-act="calDay" data-d="${ds_}"` : ''}><b>${d}</b><span>${ss.map(s => `<i>${S.plan.workouts.findIndex(w => w.id === s.wid) + 1 || '•'}</i>`).join('')}</span></button>`;
  }

/* ---------- Прогресс ---------- */
function exList() {
  const seen = new Set(), groups = [];
  S.plan.workouts.forEach(w => { const items = w.blocks.flatMap(b => b.exercises.map(e => ({ e, b: b.name }))); items.forEach(i => seen.add(i.e.id)); groups.push({ name: w.name, items }); });
  const extra = []; doneSessions().forEach(s => allEx(s).forEach(e => { if (!seen.has(e.id) && s.entries[e.id] && workSets(s.entries[e.id]).length) { seen.add(e.id); extra.push({ e, b: '' }); } }));
  if (extra.length) groups.push({ name: 'Из старого плана и разовые', items: extra });
  return groups;
}
function exSeries(exId) {
  const hist = exHistory(exId); if (!hist.length) return null;
  const e = hist[hist.length - 1].e; return { e, hist, ms: metricsFor(e) };
}
function viewProgress() {
  const done = doneSessions();
  let h = `<header class="page-h"><h1 class="display">Прогресс</h1></header><div class="seg">${[['over', 'Обзор'], ['ex', 'Упражнения'], ['meas', 'Замеры']].map(([k, l]) => `<button class="${ui.pt === k ? 'on' : ''}" data-act="pt" data-v="${k}">${l}</button>`).join('')}</div>`;
  if (ui.pt === 'over') {
    if (!done.length) return h + `<div class="empty"><div class="empty-i">${I.chart}</div><b>Графики появятся после первой тренировки</b><p>Хочешь заранее посмотреть, как всё будет выглядеть?</p><button class="btn sm" data-act="demoOn">Показать на демо-данных</button></div>`;
    const mon = mondayOf(today()), items = [];
    for (let i = 11; i >= 0; i--) { const a = addDays(mon, -7 * i), b = addDays(a, 6); items.push({ l: fDM(a), v: done.filter(s => s.date >= a && s.date <= b).length, cur: i === 0 }); }
    const tot = sum(done.map(s => sessionStats(s).sets)), vol = sum(done.map(s => sessionStats(s).vol));
    h += `<div class="tiles"><div class="tile"><b class="display">${done.length}</b><span>тренировок</span></div><div class="tile"><b class="display">${tot}</b><span>подходов</span></div><div class="tile"><b class="display">${fmt(Math.round(vol / 100) / 10)}</b><span>тонн поднято</span></div></div>`;
    h += `<section class="card"><div class="card-h"><b>Тренировок по неделям</b><span class="chip">12 недель</span></div>${barChart(items)}</section>`;
    const g1 = groupSets(addDays(today(), -6), today()), g0 = groupSets(addDays(today(), -13), addDays(today(), -7));
    const keys = Object.keys(g1).sort((a, b) => g1[b] - g1[a]), mxg = Math.max(1, ...keys.map(k => g1[k]));
    h += `<section class="card"><div class="card-h"><b>Подходов по группам</b><span class="chip">7 дней</span></div>${keys.length ? keys.map(k => { const d = g1[k] - (g0[k] || 0); return `<div class="gb"><span>${esc(k)}</span><div><i style="width:${g1[k] / mxg * 100}%"></i></div><b>${g1[k]}${d ? `<small class="${d > 0 ? 'up' : 'dn'}">${d > 0 ? '+' : ''}${d}</small>` : ''}</b></div>`; }).join('') : '<p class="cap">За последние 7 дней подходов нет.</p>'}<p class="cap">В скобках разница с предыдущими 7 днями. Видно, какие мышцы получают нагрузку, а какие остаются без внимания.</p></section>`;
    const dp = done.slice(-20).map(s => ({ x: fDM(s.date), y: sessMin(s) })).filter(p => p.y > 0);
    h += `<section class="card"><div class="card-h"><b>Длительность тренировки, мин</b></div>${lineChart(dp, { u: ' мин', h: 170 })}<p class="cap">Активное время без пауз и перерывов.</p></section>`;
    if (!ui.pf || !S.plan.workouts.some(w => w.id === ui.pf)) ui.pf = S.plan.workouts[0].id;
    const pts = done.filter(s => s.wid === ui.pf).map(s => ({ x: fDM(s.date), y: Math.round(sessionStats(s).vol) })).filter(p => p.y > 0);
    h += `<section class="card"><div class="card-h"><b>Объём тренировки, кг</b></div><div class="chips scroll">${S.plan.workouts.map(w => `<button class="chipb ${ui.pf === w.id ? 'on' : ''}" data-act="pf" data-w="${w.id}">${esc(w.name.replace('Тренировка ', 'Тр. '))}</button>`).join('')}</div>${lineChart(pts, { u: ' кг' })}<p class="cap">Объём: вес × повторения по рабочим подходам, всё приведено к кг. Упражнения с собственным весом и гравитрон в него не входят.</p></section>`;
    const recs = [];
    exList().forEach(g => g.items.forEach(({ e }) => { const hs = exHistory(e.id); if (!hs.length) return; let bs = null, bsc = -Infinity, bd = '', be = null; hs.forEach(x => { const b = bestSet(x.e, x.work), sc = setScore(x.e, b); if (sc > bsc) { bsc = sc; bs = b; bd = x.date; be = x.e; } }); recs.push({ e: be, set: bs, date: bd }); }));
    recs.sort((a, b) => (a.date < b.date ? 1 : -1));

    h += `<section class="card"><div class="card-h"><b class="display">Личные рекорды</b><span class="chip">${recs.length}</span></div>${recShow.map(r => `<div class="pr"><span>${I.trophy}</span><div><b>${esc(r.e.name)}</b><small>${esc(setText(r.e, r.set))} · ${fD(r.date)}</small></div></div>`).join('') || '<p class="cap">Пока нет.</p>'}${recs.length > 6 ? `<button class="lnk" data-act="allRecs">${ui.allRecs ? 'Свернуть' : 'Показать все (' + recs.length + ')'}</button>` : ''}</section>`;
  } else if (ui.pt === 'ex') {
    const groups = exList(); if (!ui.pe) ui.pe = groups[0].items[0].e.id;
    h += `<label class="fld" style="margin-top:14px"><span>Упражнение</span><select class="in" data-f="pe">${groups.map(g => `<optgroup label="${esc(g.name)}">${g.items.map(({ e, b }) => `<option value="${e.id}" ${e.id === ui.pe ? 'selected' : ''}>${esc(e.name)}${b ? ' · ' + esc(b) : ''}</option>`).join('')}</optgroup>`).join('')}</select></label>`;
    const sr = exSeries(ui.pe);
    if (!sr) h += `<div class="empty"><div class="empty-i">${I.trend}</div><b>Пока нет данных</b><p>График появится после первой тренировки с этим упражнением.</p></div>`;
    else {
      const { e, hist, ms } = sr, m = ms.find(x => x.k === ui.pm) || ms[0]; ui.pm = m.k;

      const diff = lastV - first, good = m.down ? diff < 0 : diff > 0;
      h += `<div class="chips scroll">${ms.map(x => `<button class="chipb ${x.k === m.k ? 'on' : ''}" data-act="pm" data-v="${x.k}">${x.l}</button>`).join('')}</div>
      <section class="card"><div class="card-h"><b class="display">${esc(e.name)}</b><span class="chip">${hist.length} ${pl(hist.length, ['тренировка', 'тренировки', 'тренировок'])}</span></div>${lineChart(pts, { u: m.u })}${m.down ? '<p class="cap">Здесь ниже значит лучше: помощь тренажёра уменьшается.</p>' : ''}${e.type === 'wr' && hist.some(x => x.s && wuOf(allEx(x.s).find(y => y.id === e.id)) !== wuOf(e)) ? `<p class="cap">Единицы веса менялись, старые записи пересчитаны в ${wl(e)}.</p>` : ''}</section>
      <div class="tiles"><div class="tile"><b class="display">${fmt(Math.round(bestV * 10) / 10)}</b><span>лучшее${m.u}</span></div><div class="tile"><b class="display">${fmt(Math.round(lastV * 10) / 10)}</b><span>последнее${m.u}</span></div><div class="tile ${good ? 'pos' : ''}"><b class="display">${diff > 0 ? '+' : ''}${fmt(Math.round(diff * 10) / 10)}</b><span>с первой тренировки</span></div></div>
      <section class="card"><div class="card-h"><b>Последние тренировки</b></div>${hist.slice(-8).reverse().map(x => `<div class="lrow"><b>${fD(x.date)}</b><span>${x.work.map(y => x.e.type === 'wr' ? fmtW(num(y.w) || 0) + '×' + fmt(num(y.r)) : fmt(num(y.r))).join(' · ')}</span></div>`).join('')}</section>`;
    }
  } else {
    const M = [['weight', 'Вес тела, кг'], ['waist', 'Талия, см'], ['hips', 'Бёдра, см'], ['glutes', 'Ягодицы, см'], ['chest', 'Грудь, см'], ['arm', 'Бицепс, см']];
