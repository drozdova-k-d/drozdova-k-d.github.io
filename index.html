:root{
  --bg:#FFF5F9;--card:#fff;--ink:#3A1B2A;--muted:#9C7B8A;--line:#F7D6E3;
  --p:#E8457C;--p-d:#C21862;--p-l:#FFD3E3;--p-xl:#FFEEF5;--gold:#D98A3D;--gold-l:#FFF0DC;
  --r:22px;--shadow:0 8px 24px rgba(232,69,124,.10);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) linear-gradient(180deg,#FFDDEA 0,#FFF5F9 340px) no-repeat;color:var(--ink);font-family:'Nunito Variable','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.35;touch-action:manipulation;min-height:100vh}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.display{font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.ic{width:22px;height:22px;display:block;flex:none}
#app{max-width:520px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(104px + var(--sb))}
body.inwork #app{padding-top:0;padding-bottom:calc(150px + var(--sb))}
body.nobar:not(.inwork) #app{padding-bottom:calc(40px + var(--sb))}

/* ---- шапка ---- */
.hero{padding:10px 4px 18px}
.hero h1{font-size:34px;line-height:1.08;margin:6px 0 10px;color:var(--ink)}
.hero-s{font-size:14px;font-weight:700;color:var(--p-d)}.hero-s::first-letter{text-transform:uppercase}
.hero-w{display:inline-block;background:var(--p);color:#fff;border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px}
.hero.sm{text-align:center;padding-top:20px}.hero.sm h1{font-size:28px}
.trophy{width:68px;height:68px;border-radius:50%;margin:0 auto 6px;background:linear-gradient(135deg,#FF9DBB,#E8457C);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(232,69,124,.35)}
.trophy .ic{width:34px;height:34px}
.page-h{padding:8px 4px 12px}.page-h h1{margin:0;font-size:32px}
.sec-h{font-weight:800;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.07em;margin:20px 4px 10px}

/* ---- карточки ---- */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:0 0 14px;border:1px solid #FCE3ED}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h b{font-size:17px}.card-h b.display{font-size:20px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--p-xl);color:var(--p-d);font-weight:800;font-size:12.5px;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.gold{background:var(--gold-l);color:var(--gold)}
.cap{font-size:13.5px;color:var(--muted);margin:10px 2px 6px}.cap.center{text-align:center;margin-top:18px}
.warn{background:#FFF0DC;color:#8A5516;border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700;margin-bottom:12px}
.warn.soft{background:var(--p-xl);color:var(--p-d)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + var(--sb));background:linear-gradient(180deg,rgba(255,245,249,0),rgba(255,245,249,.96) 30%)}

.rest-t{display:flex;flex-direction:column;min-width:64px}.rest-t small{font-size:11px;opacity:.7;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.rest-t b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.rest-p{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}.rest-p i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF8FB1,#FFD0E1);border-radius:99px;transition:width .3s linear}

@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.025)}}
.cardio .grid2{margin-top:4px}

.pr>span{width:36px;height:36px;border-radius:12px;background:var(--gold-l);color:var(--gold);display:grid;place-items:center;flex:none}.pr>span .ic{width:19px;height:19px}

/* ---- история, прогресс ---- */
.hd{width:46px;text-align:center;display:flex;flex-direction:column;background:var(--p-xl);border-radius:14px;padding:5px 0;flex:none}.hd b{font-family:'Playfair Display',serif;font-size:21px;color:var(--p-d);line-height:1.1}.hd small{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}

.chart{width:100%;height:auto;display:block;overflow:visible}

.mvals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mvals span{display:flex;flex-direction:column}.mvals small{color:var(--muted);font-weight:700;font-size:12px}.mvals b{font-size:18px;color:var(--p-d)}

/* ---- таббар, шторка, тост ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-around;padding:8px 10px calc(8px + var(--sb));background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid #FCE3ED}

.tabs button{flex:1;max-width:110px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#B9A0AC;font-size:11.5px;font-weight:800;padding:4px 0}

.fld>span{line-height:1.2}

<body>
<div id="app"></div>
<nav id="tabs" class="tabs"></nav>
<div id="rest" class="rest hidden"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   Дневник тренировок - ядро: хелперы, хранилище, план, логика
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ds(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const mondayOf = s => { const d = pd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ds(d); };
const MG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MN = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const fD = s => { const d = pd(s); return d.getDate() + ' ' + MG[d.getMonth()]; };
const fDW = s => { const d = pd(s); return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MG[d.getMonth()]; };
const fDM = s => { const d = pd(s); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1); };
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : NaN; };
const fmt = n => (isFinite(n) ? String(Math.round(n * 100) / 100).replace('.', ',') : '-');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sum = a => a.reduce((x, y) => x + y, 0);
const pl = (n, f) => { n = Math.abs(n) % 100; const m = n % 10; return n > 10 && n < 20 ? f[2] : m > 1 && m < 5 ? f[1] : m === 1 ? f[0] : f[2]; };
const roundTo = (v, step) => Math.round(v / step) * step;

/* ---------- хранилище (с запасным вариантом без localStorage) ---------- */

/* ---------- состояние ---------- */
function defaults() {
  return { v: 1, plan: { workouts: DEFAULT_PLAN() }, sessions: [], measures: [],
    settings: { rest: 90, sound: true, wake: true, start: mondayOf(today()), hideInstall: false },
    backup: { last: 0 } };
}
function load() {
  try { const raw = store.get(KEY); if (raw) { const o = JSON.parse(raw); const d = defaults();
    return Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}), backup: Object.assign(d.backup, o.backup || {}) }); } }
  catch (e) { console.error('load', e); }
  return defaults();
}
let S = load();
let saveTimer = 0;
function save() { try { store.set(KEY, JSON.stringify(S)); } catch (e) { toast('Не удалось сохранить: память заполнена. Сделай резервную копию.'); } }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
function flush() { clearTimeout(saveTimer); save(); }

/* ---------- сессии ---------- */
const cmpAsc = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.startedAt || 0) - (b.startedAt || 0));
const doneSessions = () => S.sessions.filter(s => s.status === 'done').sort(cmpAsc);
const activeSession = () => S.sessions.find(s => s.status === 'active') || null;
const sess = id => S.sessions.find(s => s.id === id) || null;
const weekNo = date => Math.max(1, Math.floor((pd(date) - pd(S.settings.start)) / 6048e5) + 1);
const allEx = s => s.layout.blocks.flatMap(b => b.exercises);

function makeSets(e) {
  const a = [];
  if (e.warm) a.push({ warm: true, w: '', r: '', done: false });
  for (let i = 0; i < e.sets; i++) a.push({ warm: false, w: '', r: '', done: false });
  return a;
}
function newSession(w, date) {
  const layout = clone({ id: w.id, name: w.name, focus: w.focus, pre: w.pre, cardio: w.cardio, stretch: w.stretch, blocks: w.blocks });
  const s = { id: uid(), wid: w.id, date: date || today(), startedAt: Date.now(), endedAt: null, status: 'active',
    week: weekNo(date || today()), layout, pre: { warmup: { done: false }, band: { done: false, note: '' } },
    entries: {}, cardio: { done: false, minutes: '', machine: '', level: '', km: '', kcal: '' }, stretch: { done: false },
    energy: 0, rating: 0, note: '', prs: [] };
  allEx(s).forEach(e => { s.entries[e.id] = { sets: makeSets(e), note: '' }; });
  return s;
}
const validSet = x => num(x.r) > 0;
const workSets = (entry) => (entry ? entry.sets.filter(x => !x.warm && validSet(x)) : []);

/* история упражнения: [{s, date, e (описание упражнения), work, warm}] по возрастанию даты */
function exHistory(exId, exceptId) {
  const out = [];
  doneSessions().forEach(s => {
    if (s.id === exceptId) return;
    const entry = s.entries[exId]; if (!entry) return;
    const work = workSets(entry); if (!work.length) return;
    const e = allEx(s).find(x => x.id === exId);
    out.push({ s, date: s.date, e, work, warm: entry.sets.find(x => x.warm && validSet(x)) || null });
  });
  return out;
}

/* рекомендация на сегодня (двойная прогрессия) */
function suggest(e, last) {
  if (!last || !last.work.length) return null;
  const work = last.work;
  const top = work.length >= e.sets && work.every(x => num(x.r) >= e.rmax);
  const ws = work.map(x => num(x.w) || 0);
  const lastW = e.assist ? Math.min(...ws) : Math.max(...ws);
  const sg = { up: top, w: null, r: null, text: '' };
  if (e.type === 'wr') {
    if (top) {
      sg.w = e.assist ? Math.max(0, lastW - e.step) : lastW + e.step; sg.r = e.rmin;
      sg.text = e.assist ? `Цель: противовес ${fmt(sg.w)} кг × ${e.rmin}. Диапазон закрыт, снижаем помощь` : `Цель: ${fmt(sg.w)} кг × ${e.rmin}. Диапазон закрыт, прибавляем вес`;
    } else sg.text = `Цель: ${fmt(lastW)} кг, добей до ${e.rmax} во всех подходах`;
  } else if (e.type === 'time') {
    sg.text = top ? `Диапазон закрыт. Добавь 5 секунд к прошлому` : `Цель: ${e.rmax} сек в каждом подходе`;
  } else {
    sg.text = top ? `Диапазон закрыт. Усложни: медленнее темп, пауза в пике или вариация` : `Цель: ${e.rmax} ${e.unit} в каждом подходе`;
  }
  return sg;
}

/* подсказки в полях (серым): что было в прошлый раз */
function placeholders(e, entry, i, last, sg) {
  const set = entry.sets[i];
  if (!last) return { w: '', r: '' };
  if (set.warm) {
    if (last.warm) return { w: String(num(last.warm.w) || ''), r: String(last.warm.r) };
    const base = sg && sg.w != null ? sg.w : Math.max(...last.work.map(x => num(x.w) || 0));
    return { w: e.type === 'wr' && base ? String(roundTo(base * 0.5, e.step)) : '', r: String(e.rmax) };
  }
  const j = entry.sets.slice(0, i).filter(x => !x.warm).length;
  const prev = last.work[j] || last.work[last.work.length - 1];
  if (sg && sg.up) return { w: sg.w != null ? String(sg.w) : '', r: String(sg.r != null ? sg.r : (num(prev.r) || '')) };
  return { w: num(prev.w) ? String(num(prev.w)) : (e.type === 'wr' ? '0' : ''), r: String(num(prev.r)) };
}

/* ---------- метрики, рекорды ---------- */
const e1rm = (w, r) => w * (1 + r / 30);
function setScore(e, x) {
  const r = num(x.r), w = num(x.w) || 0;
  if (e.type === 'wr') return e.assist ? -w * 1000 + r : (w > 0 ? e1rm(w, r) : r / 1000);
  return r;
}
function bestSet(e, sets) { let b = null, bs = -Infinity; sets.forEach(x => { const sc = setScore(e, x); if (sc > bs) { bs = sc; b = x; } }); return b; }
function setText(e, x) {
  if (!x) return '-';
  if (e.type === 'wr') return `${fmt(num(x.w) || 0)} кг × ${fmt(num(x.r))}`;
  return `${fmt(num(x.r))} ${e.type === 'time' ? 'сек' : e.unit}`;
}
function recomputePRs() {
  const best = {};
  doneSessions().forEach(s => {
    const prs = [];
    allEx(s).forEach(e => {
      const work = workSets(s.entries[e.id]); if (!work.length) return;
      const b = bestSet(e, work), sc = setScore(e, b);
      if (best[e.id] !== undefined && sc > best[e.id] + 1e-9) prs.push({ exId: e.id, name: e.name, text: setText(e, b) });
      if (best[e.id] === undefined || sc > best[e.id]) best[e.id] = sc;
    });
    s.prs = prs;
  });
}
function sessionStats(s) {
  let sets = 0, planned = 0, vol = 0, reps = 0, exDone = 0, exAll = 0;
  allEx(s).forEach(e => {
    const w = workSets(s.entries[e.id]); planned += e.sets; exAll++;
    sets += w.length; reps += sum(w.map(x => num(x.r)));
    if (e.type === 'wr' && !e.assist) vol += sum(w.map(x => (num(x.w) || 0) * num(x.r)));
    if (w.length >= e.sets) exDone++;
  });
  return { sets, planned, vol, reps, exDone, exAll };
}
function metricsFor(e) {
  const W = a => a.map(x => num(x.w) || 0), R = a => a.map(x => num(x.r));
  if (e.type === 'wr' && !e.assist) return [
    { k: 'maxw', l: 'Рабочий вес', u: ' кг', f: a => Math.max(...W(a)) },
    { k: 'vol', l: 'Объём', u: ' кг', f: a => sum(a.map(x => (num(x.w) || 0) * num(x.r))) },
    { k: 'e1', l: 'Расчётный 1ПМ', u: ' кг', f: a => Math.max(...a.map(x => e1rm(num(x.w) || 0, num(x.r)))) }];
  if (e.type === 'wr') return [
    { k: 'minw', l: 'Противовес', u: ' кг', down: true, f: a => Math.min(...W(a)) },
    { k: 'best', l: 'Лучший подход', u: ' повт.', f: a => Math.max(...R(a)) },
    { k: 'total', l: 'Всего повторений', u: ' повт.', f: a => sum(R(a)) }];
  const u = e.type === 'time' ? ' сек' : ' ' + e.unit;
  return [{ k: 'best', l: 'Лучший подход', u, f: a => Math.max(...R(a)) }, { k: 'total', l: 'Сумма по подходам', u, f: a => sum(R(a)) }];
}

/* ---------- демо-данные для просмотра графиков ---------- */
function makeDemo() {
  const start = mondayOf(addDays(today(), -70));
  const offs = [0, 1, 3, 4]; let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const hash = id => [...id].reduce((a, c) => a + c.charCodeAt(0), 0);
  for (let wk = 0; wk < 10; wk++) offs.forEach((off, wi) => {
    const date = addDays(start, wk * 7 + off);
    if (date >= today() || (wk * 4 + wi) % 11 === 7) return;
    const w = S.plan.workouts[wi]; if (!w) return;
    const s = newSession(w, date); s.demo = true; s.status = 'done'; s.week = wk + 1;
    s.startedAt = pd(date).getTime() + 18 * 36e5; s.durMin = 55 + Math.round(rnd() * 20); s.endedAt = s.startedAt + s.durMin * 6e4;
    s.energy = 3 + Math.round(rnd() * 2); s.rating = 3 + Math.round(rnd() * 2);
    s.pre.warmup.done = true; s.pre.band.done = true; s.stretch.done = true;
    if (w.cardio.on) s.cardio = { done: true, minutes: String(35 + (wk % 3) * 5), machine: 'Орбитрек', level: String(6 + (wk >> 1)), km: '', kcal: String(280 + wk * 8) };
    allEx(s).forEach(e => {
      const h = hash(e.id); const base = e.assist ? 40 : (e.step === 1 ? 3 + (h % 6) * 2 : 10 + (h % 8) * 5);
      const step = e.step, span = Math.max(0, e.rmax - e.rmin);
      s.entries[e.id].sets.forEach((x, i) => {
        if (x.warm) { x.w = e.type === 'wr' ? String(roundTo(base * 0.5, step)) : ''; x.r = String(e.rmax); x.done = true; return; }
        const j = i - (e.warm ? 1 : 0);
        x.r = String(e.rmin + ((wk * 2 + j) % (span + 1)));
        if (e.type === 'time') x.r = String(e.rmin + Math.min(span, wk + j));
        if (e.type === 'wr') x.w = String(e.assist ? Math.max(0, base - Math.floor(wk / 2) * step) : base + Math.floor(wk / 3) * step);
        x.done = true;
      });
    });
    S.sessions.push(s);
  });
  [0, 2, 4, 6, 8, 9].forEach(k => {
    const date = addDays(start, k * 7 + 6); if (date >= today()) return;
    S.measures.push({ id: uid(), date, demo: true, weight: fmt(64 - k * 0.35).replace(',', '.'), waist: String(70 - k * 0.5), hips: String(97 - k * 0.4), glutes: String(98 + k * 0.4), chest: '', arm: '' });
  });
  recomputePRs();
}

/* ---------- графики (чистый SVG, без библиотек) ---------- */
let gid = 0;
function niceTicks(mn, mx, n = 4) {
  const span = mx - mn || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const st = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => k >= raw) || raw;
  const a = Math.floor(mn / st) * st, b = Math.ceil(mx / st) * st, t = [];
  for (let v = a; v <= b + st / 2; v += st) t.push(Math.round(v * 1000) / 1000);
  return t;
}
function lineChart(pts, o = {}) {
  const id = 'c' + (++gid), W = 340, H = o.h || 190, L = 38, R = 14, T = 16, B = 28, u = o.u || '';
  if (!pts.length) return `<div class="empty-chart">Пока нет данных</div>`;
  const ys = pts.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mn === mx) { mn -= 1; mx += 1; }
  const ticks = niceTicks(mn - (mx - mn) * .08, mx + (mx - mn) * .08, 3);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const X = i => (pts.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (pts.length - 1));
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo || 1));
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = line + ` L${X(pts.length - 1).toFixed(1)} ${H - B} L${X(0).toFixed(1)} ${H - B} Z`;
  let g = '';
  ticks.forEach(t => { const y = Y(t).toFixed(1); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="gl"/><text x="${L - 6}" y="${+y + 4}" text-anchor="end" class="gt">${fmt(t)}</text>`; });
  const idx = pts.length <= 4 ? pts.map((_, i) => i) : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
  idx.forEach(i => { g += `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 && pts.length > 1 ? 'start' : i === pts.length - 1 && pts.length > 1 ? 'end' : 'middle'}" class="gt">${esc(pts[i].x)}</text>`; });
  const dots = pts.map((p, i) => {
    const last = i === pts.length - 1;
    return `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${last ? 5.5 : 3.6}" class="${last ? 'dot last' : 'dot'}"/><circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="14" fill="transparent" data-tip="${esc(p.x + ': ' + fmt(p.y) + u)}" data-tipid="${id}"/>`;
  }).join('');
  const lastP = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8457C" stop-opacity=".30"/><stop offset="1" stop-color="#E8457C" stop-opacity="0"/></linearGradient></defs>${g}${pts.length > 1 ? `<path d="${area}" fill="url(#${id}g)"/>` : ''}<path d="${line}" class="ln"/>${dots}</svg><div class="tip" id="${id}">Последнее значение: <b>${fmt(lastP.y)}${u}</b> (${esc(lastP.x)}). Нажми на точку, чтобы увидеть другое.</div>`;
}
function barChart(items, o = {}) {
  const W = 340, H = o.h || 150, L = 8, R = 8, T = 22, B = 24;
  const mx = Math.max(1, ...items.map(i => i.v)), n = items.length, bw = (W - L - R) / n;
  let g = '';
  items.forEach((it, i) => {
    const h = (H - T - B) * (it.v / mx), x = L + i * bw + bw * .18, w = bw * .64, y = H - B - h;
    g += `<rect x="${x.toFixed(1)}" y="${(it.v ? y : H - B - 2).toFixed(1)}" width="${w.toFixed(1)}" height="${(it.v ? h : 2).toFixed(1)}" rx="5" class="${it.cur ? 'bar cur' : it.v ? 'bar' : 'bar zero'}"/>`;
    if (it.v) g += `<text x="${(x + w / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" class="gt b">${fmt(it.v)}</text>`;
    if ((n - 1 - i) % (n > 8 ? 2 : 1) === 0) g += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle" class="gt">${esc(it.l)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function hearts(n, kind) { let h = ''; for (let i = 1; i <= 5; i++) h += `<button class="hr ${i <= n ? 'on' : ''}" data-act="heart" data-k="${kind}" data-n="${i}">${i <= n ? I.heartF : I.heart}</button>`; return `<div class="hearts">${h}</div>`; }
function stepper(f, val, ph, step) { return `<div class="stp"><button data-act="dec" data-f="${f}" data-step="${step}" tabindex="-1" aria-label="меньше">−</button><input data-f="${f}" inputmode="decimal" autocomplete="off" enterkeyhint="next" value="${esc(String(val).replace('.', ','))}" placeholder="${esc(String(ph).replace('.', ','))}"><button data-act="inc" data-f="${f}" data-step="${step}" tabindex="-1" aria-label="больше">+</button></div>`; }

function viewProgress() {
  const done = doneSessions();
  let h = `<header class="page-h"><h1 class="display">Прогресс</h1></header><div class="seg">${[['over', 'Обзор'], ['ex', 'Упражнения'], ['meas', 'Замеры']].map(([k, l]) => `<button class="${ui.pt === k ? 'on' : ''}" data-act="pt" data-v="${k}">${l}</button>`).join('')}</div>`;
  if (ui.pt === 'over') {
    if (!done.length) return h + `<div class="empty"><div class="empty-i">${I.chart}</div><b>Графики появятся после первой тренировки</b><p>Хочешь заранее посмотреть, как всё будет выглядеть?</p><button class="btn sm" data-act="demoOn">Показать на демо-данных</button></div>`;
    const mon = mondayOf(today()), items = [];
    for (let i = 11; i >= 0; i--) { const a = addDays(mon, -7 * i), b = addDays(a, 6); items.push({ l: fDM(a), v: done.filter(s => s.date >= a && s.date <= b).length, cur: i === 0 }); }
    const tot = sum(done.map(s => sessionStats(s).sets)), vol = sum(done.map(s => sessionStats(s).vol));
    h += `<div class="tiles"><div class="tile"><b class="display">${done.length}</b><span>тренировок</span></div><div class="tile"><b class="display">${tot}</b><span>подходов</span></div><div class="tile"><b class="display">${fmt(Math.round(vol / 100) / 10)}</b><span>тонн поднято</span></div></div>`;
    h += `<section class="card"><div class="card-h"><b>Тренировок по неделям</b><span class="chip">12 недель</span></div>${barChart(items)}</section>`;
    if (!ui.pf || !S.plan.workouts.some(w => w.id === ui.pf)) ui.pf = S.plan.workouts[0].id;
    const pts = done.filter(s => s.wid === ui.pf).map(s => ({ x: fDM(s.date), y: Math.round(sessionStats(s).vol) })).filter(p => p.y > 0);
    h += `<section class="card"><div class="card-h"><b>Объём тренировки, кг</b></div><div class="chips scroll">${S.plan.workouts.map(w => `<button class="chipb ${ui.pf === w.id ? 'on' : ''}" data-act="pf" data-w="${w.id}">${esc(w.name.replace('Тренировка ', 'Тр. '))}</button>`).join('')}</div>${lineChart(pts, { u: ' кг' })}<p class="cap">Объём считается как вес × повторения по рабочим подходам. Упражнения с собственным весом и гравитрон в него не входят.</p></section>`;
    const recs = [];
    exList().forEach(g => g.items.forEach(({ e }) => { const hs = exHistory(e.id); if (!hs.length) return; let bs = null, bsc = -Infinity, bd = ''; hs.forEach(x => { const b = bestSet(x.e, x.work), sc = setScore(x.e, b); if (sc > bsc) { bsc = sc; bs = b; bd = x.date; } }); recs.push({ e, set: bs, date: bd }); }));
    recs.sort((a, b) => (a.date < b.date ? 1 : -1));
    const recShow = ui.allRecs ? recs : recs.slice(0, 6);
    h += `<section class="card"><div class="card-h"><b class="display">Личные рекорды</b><span class="chip">${recs.length}</span></div>${recShow.map(r => `<div class="pr"><span>${I.trophy}</span><div><b>${esc(r.e.name)}</b><small>${esc(setText(r.e, r.set))} · ${fD(r.date)}</small></div></div>`).join('') || '<p class="cap">Пока нет.</p>'}${recs.length > 6 ? `<button class="lnk" data-act="allRecs">${ui.allRecs ? 'Свернуть' : 'Показать все (' + recs.length + ')'}</button>` : ''}</section>`;
  } else if (ui.pt === 'ex') {
    const groups = exList(); if (!ui.pe) ui.pe = groups[0].items[0].e.id;
    h += `<label class="fld" style="margin-top:14px"><span>Упражнение</span><select class="in" data-f="pe">${groups.map(g => `<optgroup label="${esc(g.name)}">${g.items.map(({ e, b }) => `<option value="${e.id}" ${e.id === ui.pe ? 'selected' : ''}>${esc(e.name)}${b ? ' · ' + esc(b) : ''}</option>`).join('')}</optgroup>`).join('')}</select></label>`;
    const sr = exSeries(ui.pe);
    if (!sr) h += `<div class="empty"><div class="empty-i">${I.trend}</div><b>Пока нет данных</b><p>График появится после первой тренировки с этим упражнением.</p></div>`;
    else {
      const { e, hist, ms } = sr, m = ms.find(x => x.k === ui.pm) || ms[0]; ui.pm = m.k;
      const pts = hist.map(x => ({ x: fDM(x.date), y: m.f(x.work) }));
      const bestV = m.down ? Math.min(...pts.map(p => p.y)) : Math.max(...pts.map(p => p.y)), first = pts[0].y, lastV = pts[pts.length - 1].y;
      const diff = lastV - first, good = m.down ? diff < 0 : diff > 0;
      h += `<div class="chips scroll">${ms.map(x => `<button class="chipb ${x.k === m.k ? 'on' : ''}" data-act="pm" data-v="${x.k}">${x.l}</button>`).join('')}</div>
      <section class="card"><div class="card-h"><b class="display">${esc(e.name)}</b><span class="chip">${hist.length} ${pl(hist.length, ['тренировка', 'тренировки', 'тренировок'])}</span></div>${lineChart(pts, { u: m.u })}${m.down ? '<p class="cap">Здесь ниже значит лучше: помощь тренажёра уменьшается.</p>' : ''}</section>
      <div class="tiles"><div class="tile"><b class="display">${fmt(bestV)}</b><span>лучшее${m.u}</span></div><div class="tile"><b class="display">${fmt(lastV)}</b><span>последнее${m.u}</span></div><div class="tile ${good ? 'pos' : ''}"><b class="display">${diff > 0 ? '+' : ''}${fmt(diff)}</b><span>с первой тренировки</span></div></div>
      <section class="card"><div class="card-h"><b>Последние тренировки</b></div>${hist.slice(-8).reverse().map(x => `<div class="lrow"><b>${fD(x.date)}</b><span>${x.work.map(y => x.e.type === 'wr' ? fmt(num(y.w) || 0) + '×' + fmt(num(y.r)) : fmt(num(y.r))).join(' · ')}</span></div>`).join('')}</section>`;
    }
  } else {
    const M = [['weight', 'Вес тела, кг'], ['waist', 'Талия, см'], ['hips', 'Бёдра, см'], ['glutes', 'Ягодицы, см'], ['chest', 'Грудь, см'], ['arm', 'Бицепс, см']];
        const list = S.measures.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    h += `<button class="btn block" style="margin-top:14px" data-act="measForm">+ Добавить замер</button>`;
    const pts = list.filter(m => num(m[ui.mk]) > 0).map(m => ({ x: fDM(m.date), y: num(m[ui.mk]) }));
    h += `<div class="chips scroll" style="margin-top:14px">${M.map(([k, l]) => `<button class="chipb ${ui.mk === k ? 'on' : ''}" data-act="mk" data-v="${k}">${l.split(',')[0]}</button>`).join('')}</div><section class="card"><div class="card-h"><b>${M.find(x => x[0] === ui.mk)[1]}</b></div>${lineChart(pts, { u: ui.mk === 'weight' ? ' кг' : ' см' })}</section>`;
    h += list.slice().reverse().map(m => `<div class="card mrow"><div class="card-h"><b>${fD(m.date)}</b><button class="icon-btn sm" data-act="measDel" data-id="${m.id}">${I.trash}</button></div><div class="mvals">${M.filter(([k]) => num(m[k]) > 0).map(([k, l]) => `<span><small>${l.split(',')[0]}</small><b>${fmt(num(m[k]))}</b></span>`).join('')}</div></div>`).join('');
  }
  return h;
}

  const y = window.scrollY, v = ui.view;

function go(view, p) { Object.assign(ui, { view }, p || {}); render(false); }

/* ---------- Таймер отдыха ---------- */
let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { } }
function beep() {
  if (!S.settings.sound || !actx) return;
  try { const t = actx.currentTime; [0, .24, .48].forEach((d, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = i === 2 ? 1046 : 784; g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.3, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .2); o.connect(g); g.connect(actx.destination); o.start(t + d); o.stop(t + d + .22); }); } catch (e) { }
}
const restFor = e => e.rest || (e.type === 'wr' ? S.settings.rest : Math.min(S.settings.rest, 60));
function startRest(sec) { unlockAudio(); rest = { end: Date.now() + sec * 1000, total: sec, over: false, overAt: 0 }; drawRest(true); }
function drawRest(fresh) {
  const el = $('#rest');
  if (!rest || ui.view !== 'workout') { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  if (fresh || !el.firstChild) el.innerHTML = `<div class="rest-i"><div class="rest-t"><small>отдых</small><b id="restT">0:00</b></div><div class="rest-p"><i id="restP"></i></div><button data-act="restm">−15</button><button data-act="restp">+15</button><button data-act="rests" aria-label="пропустить">${I.x}</button></div>`;
  tickRest();
}
function tickRest() {
  if (!rest) return;
  const left = Math.ceil((rest.end - Date.now()) / 1000);

    else if (f.startsWith('c.')) { s.cardio[f.slice(2)] = v; saveSoon(); }
  } else if (ui.view === 'summary' && s && f === 'durMin') { s.durMin = parseInt(v) || 0; saveSoon(); }
  else if (ui.view === 'planw') { const w = S.plan.workouts.find(x => x.id === ui.pw); if (f === 'pn.name') w.name = v; else if (f === 'pn.focus') w.focus = v; else if (f === 'pb.name') w.blocks.find(b => b.id === el.dataset.b).name = v; saveSoon(); }
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-f]');
  if (el && el.dataset.f === 'pe') { ui.pe = el.value; ui.pm = null; render(); }
  if (el && el.dataset.f === 'start') { if (el.value) { S.settings.start = el.value; flush(); render(); } }
  if (ev.target.id === 'imp' && ev.target.files[0]) { const r = new FileReader(); r.onload = () => importAsk(String(r.result)); r.readAsText(ev.target.files[0]); ev.target.value = ''; }
});
document.addEventListener('focusin', ev => { if (ev.target.matches && ev.target.matches('.stp input')) setTimeout(() => { try { ev.target.select(); } catch (e) { } }, 0); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.stp input')) ev.target.blur(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); else { wake(); tickRest(); } });
window.addEventListener('pagehide', flush);

/* ---------- старт ---------- */
(function init() {
  $('#tabs').innerHTML = [['home', I.home, 'Главная'], ['history', I.list, 'История'], ['progress', I.chart, 'Прогресс'], ['more', I.more, 'Ещё']].map(([v, i, l]) => `<button data-act="tab" data-v="${v}">${i}<span>${l}</span></button>`).join('');
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  const a = activeSession();
  if (a && Date.now() - a.startedAt < 14 * 36e5) { ui.sid = a.id; ui.view = 'workout'; ui.from = 'home'; }
  render(false);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
})();

</script>
